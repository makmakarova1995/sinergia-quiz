<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Персональная презентация — Executive MBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#FF003D;--tx:#f2f2f2;--tx2:#b9b9b9;--tx3:#7a7a7a;--card:#1C1C1C;--line:#2c2c2c;
  --serif:'Playfair Display','Times New Roman',Georgia,serif;
  --sans:'Manrope','Inter',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#111;color:var(--tx);font-weight:300;line-height:1.5}

/* ── панель сборки (не печатается) ── */
.panel{background:#161616;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:99}
.panel-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel .ttl{font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx2);white-space:nowrap}
.who{display:flex;gap:7px;flex-wrap:wrap}
.who input{background:#0d0d0d;border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  color:#fff;font-family:var(--sans);font-size:13px;width:140px;outline:none}
.who input:focus{border-color:var(--red)}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-left:auto}
.btn{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
  padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--red);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cnt{color:var(--tx3);font-size:12.5px;white-space:nowrap}
.cnt b{color:#fff}
.drawer{max-width:1180px;margin:0 auto;padding:0 20px;overflow:hidden;max-height:0;transition:max-height .22s ease}
.drawer.open{max-height:460px;overflow-y:auto;padding-bottom:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;padding-top:4px}
.pick{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13px;color:var(--tx2);transition:.14s}
.pick:hover{border-color:#444}
.pick.on{border-color:var(--red);color:#fff;background:#1f1517}
.pick input{accent-color:var(--red);margin-top:2px;flex:none}

/* ── слайды ── */
.deck{max-width:1180px;margin:0 auto;padding:16px 20px 50px}
.slide{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#353535 0%,#0a0a0a 55%,#000 100%);
  border:1px solid #242424;border-radius:10px;padding:5.2% 6%;margin-bottom:18px;overflow:hidden;
  display:flex;flex-direction:column}
.slide .mark{position:absolute;top:4.4%;right:5%;width:30px;height:30px;border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center}
.slide .mark::before{content:'❮';color:#fff;font-size:12px}
.slide .ft{position:absolute;bottom:4%;left:6%;right:6%;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a4a4a}
.kick{color:var(--red);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.slide h1{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.04;
  font-size:clamp(26px,3.6vw,50px)}
.slide h2{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.08;
  font-size:clamp(20px,2.5vw,34px);margin-bottom:18px}
.slide h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  font-weight:600;margin-bottom:9px}
.quote{font-family:var(--serif);font-size:clamp(17px,2vw,27px);line-height:1.34;color:#fff;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3.4%;flex:1;min-height:0}
.box{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3.4% 3.8%}
.box.dim{border-left-color:#4a4a4a}
.box p,.box li{font-size:clamp(11.5px,1.07vw,15px);color:var(--tx2);line-height:1.5}
.box b{color:#fff;font-weight:600}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:7px}
li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.box.dim li::before{background:#555}
.fig{font-family:var(--serif);color:var(--red);font-size:1.22em}
.who-t{color:#fff;font-weight:600}
.reg{display:block;color:var(--tx3);font-size:.86em}
.modn{display:inline-block;font-family:var(--serif);font-size:.82em;letter-spacing:.06em;color:#fff;
  background:var(--red);border-radius:3px;padding:1px 7px;margin-right:7px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:1.6% 3.4%;flex:1;align-content:start}
.mods div{font-size:clamp(10.5px,.98vw,14px);color:var(--tx2);padding:1.5% 0;border-bottom:1px solid #1e1e1e}
.mods .no{font-family:var(--serif);color:var(--red);margin-right:9px}
.teach{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4% 3%;flex:1;align-content:start}
.teach div{font-size:clamp(10px,.92vw,13px);color:var(--tx3);line-height:1.38}
.teach b{display:block;color:#fff;font-weight:600;font-size:1.1em;margin-bottom:3px;
  font-family:var(--serif);text-transform:uppercase;letter-spacing:.02em}
.empty{color:var(--tx3);text-align:center;padding:70px 20px;font-size:15px}

/* обложка — как первый и последний слайд в презентации школы */
.slide.cover{padding:0;background:linear-gradient(135deg,#d4142c 0%,#8a0818 100%)}
.cover .for{position:absolute;left:4.4%;top:8%;max-width:50%;font-family:var(--serif);
  font-size:clamp(14px,1.6vw,22px);color:#fff;line-height:1.3}
.cover .for small{display:block;font-family:var(--sans);font-size:.5em;letter-spacing:.2em;
  text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:6px}
/* стоимость и рассрочка */
.price{font-family:var(--sans);font-weight:600;color:#fff;line-height:1;letter-spacing:-.02em;
  font-size:clamp(34px,5.4vw,76px);margin:auto 0}
.price-note{font-size:clamp(10px,.85vw,12px);letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600}
.incl{counter-reset:i}
.incl li{counter-increment:i;padding-left:34px;padding-bottom:2.2%;margin-bottom:2.2%;border-bottom:1px solid #262626}
.incl li::before{content:counter(i);background:none;border:1px solid #444;border-radius:999px;width:22px;height:17px;
  top:1px;font-family:var(--serif);font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}
.duo{margin-top:3%;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.duo .fig{font-size:clamp(20px,2.2vw,30px)}
.todo{color:#ffb020;font-style:normal}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:3% 0 2.4%}
.week span{text-align:center;padding:7px 0;border-radius:4px;font-size:clamp(10px,.9vw,13px);font-weight:600;letter-spacing:.08em}
.week .w{background:var(--red);color:#fff}
.week .o{background:#2a2a2a;color:var(--tx2)}
.wk-note{font-size:clamp(10.5px,.95vw,13.5px);color:var(--tx2);line-height:1.45}
.wk-note b{color:#fff;font-weight:600}
.trj{width:100%;border-collapse:collapse;font-size:clamp(10.5px,.98vw,14px)}
.trj td{padding:2.2% 2% 2.2% 0;border-bottom:1px solid #262626;vertical-align:top;color:var(--tx2)}
.trj td:first-child{color:#fff;width:46%}
.trj td:nth-child(2){white-space:nowrap}
/* пункты в столбик на всю высоту колонки */
.stack{display:flex;flex-direction:column}
.stack .st{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid #2a2a2a;padding:3% 0}
.stack h3+.st{border-top:none}
.stack .lbl{font-family:var(--serif);color:var(--red);font-size:clamp(14px,1.45vw,20px);line-height:1.15;margin-bottom:1.5%}
.stack .st p{font-size:clamp(12px,1.2vw,17px);color:#e6e6e6;line-height:1.42}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6%;flex:1;min-height:0}
.fmts .box{display:flex;flex-direction:column}
.fmts .price{font-size:clamp(24px,3vw,42px);margin:auto 0 0}
/* преподаватели с фото */
.tph{display:grid;grid-template-columns:repeat(6,1fr);gap:2% 1.6%;flex:1;min-height:0;align-content:start}
.tph div{background:rgba(255,255,255,.03);border:1px solid #262626;border-radius:6px;padding:5%;
  font-size:clamp(8.5px,.74vw,10.5px);color:var(--tx3);line-height:1.32}
.tph img{width:100%;aspect-ratio:1.3;object-position:50% 20%;object-fit:cover;border-radius:4px;display:block;margin-bottom:6%;background:#5a5a5a}
.tph b{display:block;color:#fff;font-family:var(--serif);font-weight:500;text-transform:uppercase;
  font-size:clamp(9.5px,.86vw,12px);line-height:1.15;margin-bottom:3%}
.tph div span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.also{margin-top:1.6%;margin-bottom:2.4%;font-size:clamp(9.5px,.82vw,11.5px);color:var(--tx3)}
.also b{color:var(--tx2);font-weight:500}
/* цифры */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3%}
.stat{background:rgba(255,255,255,.035);border-radius:6px;padding:7% 8%}
.stat .num{font-family:var(--serif);font-size:clamp(28px,3.6vw,52px);line-height:1;color:#fff}
.stat .num.red{color:var(--red)}
.stat p{font-size:clamp(10.5px,.95vw,13.5px);color:var(--tx2);margin-top:6%;line-height:1.35}
.res{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:3.4% 2.6%;flex:1;min-height:0}
.res .stat{border-left:2px solid var(--red);display:flex;flex-direction:column}
.res .stat .num{color:var(--red);font-size:clamp(24px,2.9vw,42px)}
.res .stat small{margin-top:auto;padding-top:4%;font-size:clamp(9.5px,.8vw,11.5px);color:var(--tx3)}
.res .stat small b{color:#fff;font-weight:600}
/* кейс */
.case{display:grid;grid-template-columns:1.25fr 1fr;gap:3.4%;flex:1;min-height:0}
.case .big{font-family:var(--serif);color:var(--red);font-size:clamp(34px,4.8vw,68px);line-height:1}
.case .bigt{font-size:clamp(12px,1.15vw,16px);color:#fff;margin-top:3%;max-width:90%}
.case .ph{width:34%;aspect-ratio:.8;object-fit:cover;border-radius:6px;float:right;margin:0 0 4% 5%}
.case .qt{font-family:var(--serif);font-size:clamp(13px,1.3vw,18px);color:#fff;line-height:1.35;margin-top:auto}

@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .panel,.noprint{display:none!important}
  .deck{max-width:none;padding:0;margin:0}
  .slide{border:none;border-radius:0;margin:0;page-break-after:always;break-after:page;
    width:100vw;height:100vh;aspect-ratio:auto;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* EMBA: обложка и мелочи */
.cover .cv{position:absolute;left:6%;bottom:9%;right:6%}
.cover .cv small{display:block;font-size:clamp(10px,1vw,14px);letter-spacing:.24em;text-transform:uppercase;color:#fff;opacity:.85;margin-bottom:2%}
.cover .cv .big{font-family:var(--serif);font-weight:500;text-transform:uppercase;color:#fff;line-height:.95;font-size:clamp(40px,8vw,112px)}
.cover .cv p{font-family:var(--serif);color:#fff;font-size:clamp(15px,2vw,28px);margin-top:2%}
.cover .bdg{position:absolute;right:5%;top:8%;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.cover .bdg span{border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:999px;padding:5px 12px;font-size:clamp(9px,.85vw,12px);letter-spacing:.12em;text-transform:uppercase}
.qline{font-family:var(--serif);color:#fff;font-size:clamp(14px,1.5vw,21px);line-height:1.3;border-bottom:1px solid #2a2a2a;padding-bottom:3%;margin-bottom:1%}
.qline small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:2% 3%}
.tracks div{font-size:clamp(11px,1vw,14px);color:var(--tx2);border-bottom:1px solid #222;padding:2% 0}
.tracks div b{color:#fff;font-weight:600}
.mods.col{grid-auto-flow:column;grid-template-rows:repeat(9,auto)}
.dense .st{padding:1.4% 0!important}
.dense .lbl{font-size:clamp(11px,1.05vw,15px)!important}
.dense .st p{font-size:clamp(10px,.92vw,13px)!important}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6%;flex:1;min-height:0}
.steps .box{display:flex;flex-direction:column}
.steps .n{font-family:var(--serif);color:var(--red);font-size:clamp(28px,3.6vw,52px);line-height:1;margin-bottom:6%}
</style>
</head>
<body>

<div class="panel noprint"><div class="panel-in">
  <span class="ttl">Презентация Executive MBA</span>
  <div class="who">
    <input id="nm" placeholder="Имя клиента" oninput="render()">
    <input id="co" placeholder="Компания" oninput="render()">
  </div>
  <div class="acts">
    <span class="cnt" id="cnt"></span>
    <button class="btn" onclick="dr()">Задачи ▾</button>
    <button class="btn" onclick="all(true)">Все</button>
    <button class="btn" onclick="all(false)">Снять</button>
    <button class="btn pri" onclick="window.print()">Сохранить в PDF</button>
  </div>
</div>
<div class="drawer" id="drawer"><div class="picks" id="picks"></div></div></div>

<div class="deck" id="deck"></div>

<script>
const CASES=[
{k:'nishchev',n:'Сергей Нищев',r:'Генеральный директор «Башинформсвязи», группа «Ростелеком»',
 did:['Дипломную работу сделал не в стол, а по своей компании','Выпускной проект — оптимизация бизнес-процессов, доведённая до цифры, которую принял бизнес'],
 fig:'200 млн ₽',figt:'экономии в год. Обучение окупилось за первый же год',for:['know','proj']},
{k:'kuzyakov',n:'Николай Кузяков',r:'Соучредитель «Ванюшкины сладости»',
 sc:'Кондитерское производство: выручка 2+ млрд ₽, 11 цехов, 200+ сотрудников, экспорт в 12 стран',
 did:['После модуля по стратегии — план оптимизации всей производственной цепочки','После модуля по маркетингу пересобрал продвижение: просмотры в соцсетях выросли с 5 до 10 млн, за ними — продажи','После модуля по цифровизации внедрил нейросети на контроле санитарных норм и качества'],
 fig:'+5–7%',figt:'маржинальности после модуля по стратегии',for:['ai','strat','growth']},
{k:'kapyev',n:'Евгений Капьев',r:'Генеральный директор издательской группы «Эксмо-АСТ»',ph:'design-img/case-kapyev.jpg',
 did:['На программе разработал и запустил проект выхода редакции Non-fiction на зарубежные рынки','Собрал стратегию позиционирования книг для зарубежных издательств','Разработал свои методики отбора, мотивации и развития — люди, которых он по ним растил, сейчас на ключевых позициях'],
 fig:'24 страны',figt:'куда удалось продать права российских авторов',
 q:'«Самый важный блок, который я вынес, — управление командой»',for:['sys']},
{k:'isaev',n:'Андрей Исаев',r:'Сооснователь и генеральный директор ДНКОМ',
 sc:'Сеть медицинских лабораторий, выручка 2,7 млрд ₽',
 did:['До программы управленческие решения принимались на основе личного опыта: по образованию он врач, а не менеджер','Прошёл обучение вместе с исполнительным директором и супругой — изменения внедряли одновременно на уровне всего топ-менеджмента','Пересобрал управленческую команду, пересмотрел систему KPI и выстроил процесс найма по методикам программы'],
 fig:'Весь топ-менеджмент',figt:'обучался вместе и внедрял изменения по ходу программы, а не после выпуска',for:['sys','circle']},
{k:'yuditskaya',n:'Анастасия Юдицкая',f:1,r:'Основательница Pirouette',
 sc:'Сеть школ художественной гимнастики',
 did:['До программы сеть работала в Москве, Подмосковье и Петербурге, а решения о развитии принимались интуитивно','На программе — инструменты оценки рынков: трендвотчинг, управленческая экономика и выездной модуль в кампусе школы в Дубае с практикой ведения бизнеса в ОАЭ','По итогам оценила рынок ОАЭ как точку роста и открыла направление в Дубае'],
 fig:'Выход на зарубежные рынки',figt:'школы Pirouette работают в Дубае: бизнес перестал зависеть от одного рынка',
 q:'«Учёба в бизнес-школе помогла мне принять решение о выходе на зарубежные рынки»',for:['mkts']},
{k:'remenyako',n:'Денис Ременяко',r:'Владелец и генеральный директор «ФК Гранд Капитал»',
 sc:'Четвёртый фармдистрибьютор России, оборот 250 млрд ₽',
 did:['Прошёл модуль по презентации и публичным выступлениям','Перешёл от импровизации к чёткой структуре выступления','Получил алгоритм подготовки к любому выступлению: переговоры, презентации партнёрам, отраслевые площадки'],
 fig:'Без импровизации',figt:'первое лицо компании с оборотом 250 млрд ₽ представляет её решения партнёрам и рынку по выверенной структуре',for:['circle']}
];

const DEF_CASES=['nishchev','kuzyakov','isaev'];
function pickCases(list){
  const ks=new Set(list.map(i=>i.k));
  const o=CASES.filter(c=>c.for.some(k=>ks.has(k)));
  for(const k of DEF_CASES){if(o.length>=3)break;if(!o.find(c=>c.k===k))o.push(CASES.find(c=>c.k===k))}
  return o;
}
const cs=k=>CASES.find(c=>c.k===k);

// модули — со слайдов «Модули программы» презентации школы (поток 003)
const MODS=['Нулевой модуль: знакомство','Стратегия бизнеса','Бизнес-миссия: Бразилия, Аргентина','Макроэкономика и мегатренды','Бизнес-миссия: Индия','Маркетинг и продажи','Осознанное лидерство','GR, PR, IR','Бизнес-миссия: ОАЭ, Саудовская Аравия','Стратегия продукта','Цифровая трансформация','Бизнес-миссия: Китай','Финансовые стратегии, IPO','Креативность','Оргтрансформация','Операционное и корпоративное управление','Итоговая аттестация: защита выпускных проектов'];

const SCHOOL=[['38 лет','с 1988 года, первая частная бизнес-школа в России и СНГ',true],['50 000+','выпускников'],['7','аккредитаций AMBA'],['54','преподавателя: 24 профессора-практика и 30 преподавателей']];

          <p class="bigt">${c.figt}</p>
          ${c.q?`<p class="qt">${c.q}</p>`:''}
        </div></div></section>`));

  // итог
  add(n=>`<section class="slide">${ft(n)}
    <div class="kick">Итог</div>
    <h2>Что у вас будет после программы</h2>
    <div class="cols" style="grid-template-columns:1.35fr 1fr">
      <div class="box stack${list.length>5?' dense':''}"><h3>По вашим задачам</h3>
        ${list.map(i=>{const [l,t]=FIN[i.k].replace('<b>','').split('</b>');
          return `<div class="st"><div class="lbl" style="font-size:clamp(13px,1.3vw,18px)">${l.replace(/:\s*$/,'')}</div><p>${t.trim().replace(/^[,—–:-]\s*/,'').replace(/^./,x=>x.toUpperCase())}</p></div>`}).join('')}
      </div>
      <div class="box dim" style="display:flex;flex-direction:column;justify-content:center">
        <p class="quote" style="font-size:clamp(18px,2.1vw,30px)">Вы делаете свою компанию на программе, а не после неё</p>
        <p style="margin-top:6%;color:var(--tx2);font-size:clamp(11.5px,1.07vw,15px)">Инструменты применяются к вашему бизнесу по ходу обучения, а выпускной проект защищается по вашей компании. Мы ничего не обещаем за вас: систему, которая работает, собираете вы сами, а школа даёт практиков, группу и рамку.</p>
      </div></div></section>`);

  // траектория
  add(n=>`<section class="slide">${ft(n)}
    <div class="kick">Индивидуальный план</div>
    <h2>Траектория под ваши задачи</h2>
    <div class="cols">
      <div class="box dim" style="overflow:hidden"><h3>Задача → модули</h3>
        <table class="trj"><tbody>${list.map(i=>`<tr><td>${i.s}</td><td>${i.mods.map(m=>`<span class="modn">модуль ${m}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>
      <div class="box stack"><h3>Как это устроено</h3>
        <div class="st"><div class="lbl">01 · Вся программа</div><p>Вы проходите все 16 модулей за два года; задачи выше показывают, на что обратить внимание в каждом из них</p></div>
        <div class="st"><div class="lbl">02 · Выпускной проект</div><p>Тема проекта — задача вашей компании</p></div>
        <div class="st"><div class="lbl">03 · Круг остаётся</div><p>Группа и клуб EMBA работают и после выпуска</p></div>
      </div></div></section>`);

  // стоимость
  add(n=>`<section class="slide">${ft(n)}
    <div class="kick">Стоимость</div>
    <h2>Условия участия, поток 003</h2>
    <div class="cols">
      <div class="box" style="display:flex;flex-direction:column"><h3>Стоимость участия</h3>
        <div class="price" style="margin:4% 0 0">${rub(PRICE)}</div>
        <p class="price-note" style="margin:2% 0 auto">${todo('[что входит в стоимость: перелёты и проживание на миссиях, сроки оплаты — уточнить у школы]')}</p>
      </div>
      <div class="box dim"><h3>Что включено в программу</h3>
        <ul class="incl"><li>16 модулей за 2 года</li><li>Выездные бизнес-миссии в 6 стран</li><li>Закрытый клуб EMBA и «пятёрки»</li><li>Восемь треков: личный бренд, здоровье, коучинг и другие</li><li>Выпускной проект по вашей компании</li></ul>
      </div></div></section>`);

  // оплата
  add(n=>`<section class="slide">${ft(n)}
    <div class="kick">Оплата</div>
    <h2>Можно платить частями</h2>
    <div class="fmts">
      <div class="box"><h3>Образовательный кредит</h3><p>Партнёр школы — ПСБ: <span class="fig">12,98%</span> годовых</p><p style="margin-top:6%">${todo('[сумма платежа и срок — уточнить у ПСБ]')}</p></div>
      <div class="box dim"><h3>Грант</h3><p>Конкурс грантов школы — до <span class="fig">2,5 млн ₽</span></p><p style="margin-top:6%">${todo('[условия и сроки конкурса — подтвердить у школы]')}</p></div>
      <div class="box dim"><h3>Оплата по этапам</h3><p>${todo('[можно ли платить по году или полугодию — решение школы]')}</p></div>
    </div></section>`);

  // следующий шаг
  add(n=>`<section class="slide">${ft(n)}
    <div class="kick">Следующий шаг</div>
    <h2>Бизнес-консультация</h2>
    <div class="steps">
      <div class="box"><div class="n">01</div><h3>Честный ответ</h3><p>Подходит ли вам Executive MBA сейчас, или лучше Foundation MBA, или пока не нужно</p></div>
      <div class="box dim"><div class="n">02</div><h3>Состав потока</h3><p>Кто в ближайшей группе по отраслям и оборотам, кто реально ведёт модули</p></div>
      <div class="box dim"><div class="n">03</div><h3>Календарь и план</h3><p>Дни модулей на год и траектория под ваши задачи. ${todo('[контакт менеджера и дата — вписать]')}</p></div>
    </div></section>`);

  add(()=>cover());

  d.innerHTML=S.map((f,i)=>f(i+1)).join('');
  slideCount=S.length;cnt();
}

try{JSON.parse(localStorage.getItem('deckEmbaPicks')||'[]').forEach(k=>ITEMS.find(i=>i.k===k)&&sel.add(k))}catch(e){}
const qs=new URLSearchParams(location.search);
if(qs.get('p'))qs.get('p').split(',').filter(Boolean).forEach(k=>ITEMS.find(i=>i.k===k)&&sel.add(k));
if(qs.get('nm'))document.getElementById('nm').value=qs.get('nm');
if(qs.get('co'))document.getElementById('co').value=qs.get('co');
const _tog=tog;
picks();render();
if(!sel.size)document.getElementById('drawer').classList.add('open');

</script>
