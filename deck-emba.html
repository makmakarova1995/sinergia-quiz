<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Executive MBA — польза для бизнеса</title>
<style>
:root{--red:#FF003D;--tx:#f2f2f2;--tx2:#b9b9b9;--tx3:#7a7a7a;--card:#1C1C1C;--line:#2c2c2c;
  --serif:'Playfair Display','Times New Roman',Georgia,serif;
  --sans:'Manrope','Inter',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#111;color:var(--tx);font-weight:300;line-height:1.5}

/* ── панель сборки (не печатается) ── */
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);align-items:start}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:#161616;border-right:1px solid var(--line);z-index:99}
.panel{position:sticky;top:0;background:#161616;border-bottom:1px solid var(--line);z-index:2}
.panel-in{padding:14px 16px;display:flex;flex-direction:column;align-items:stretch;gap:9px}
.panel .ttl{font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx2);white-space:nowrap}
.who{display:flex;gap:7px}
.who input{background:#0d0d0d;border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  color:#fff;font-family:var(--sans);font-size:13px;width:100%;min-width:0;outline:none}
.who input:focus{border-color:var(--red)}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.acts .pri{flex:1}
.btn{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
  padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--red);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cnt{color:var(--tx3);font-size:12.5px;white-space:nowrap}
.cnt b{color:#fff}
.drawer{padding:0 16px 20px}
.picks{display:grid;grid-template-columns:1fr;gap:6px;padding-top:13px}
.pick{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13px;color:var(--tx2);transition:.14s}
.pick:hover{border-color:#444}
.pick.on{border-color:var(--red);color:#fff;background:#1f1517}
.pick input{accent-color:var(--red);margin-top:2px;flex:none}

/* ── слайды ── */
.deck{margin:0 auto;padding:16px 20px 50px;min-width:0;width:100%;overflow:hidden}
.slide-stage{position:relative;width:100%;aspect-ratio:16/9;margin-bottom:18px;overflow:hidden}
.slide-stage>.slide{position:absolute;left:0;top:0;width:960px;height:540px;margin:0;transform:scale(var(--slide-scale,1));transform-origin:top left}
.slide{position:relative;container-type:inline-size;aspect-ratio:16/9;background:linear-gradient(135deg,#353535 0%,#0a0a0a 55%,#000 100%);
  border:1px solid #242424;border-radius:10px;padding:5.2% 6%;margin-bottom:18px;overflow:hidden;
  display:flex;flex-direction:column}
.slide .mark{position:absolute;top:4.4%;right:5%;width:30px;height:30px;border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center}
.slide .mark::before{content:'❮';color:#fff;font-size:12px}
.slide .ft{position:absolute;bottom:4%;left:6%;right:6%;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a4a4a}
.kick{color:var(--red);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.slide h1{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.04;
  font-size:clamp(26px,3.6cqw,50px)}
.slide h2{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.08;
  font-size:clamp(20px,2.5cqw,34px);margin-bottom:18px}
.slide h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  font-weight:600;margin-bottom:9px}
.quote{font-family:var(--serif);font-size:clamp(17px,2cqw,27px);line-height:1.34;color:#fff;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3.4%;flex:1;min-height:0}
.box{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3.4% 3.8%}
.box.dim{border-left-color:#4a4a4a}
.box p,.box li{font-size:clamp(11.5px,1.07cqw,15px);color:var(--tx2);line-height:1.5}
.box b{color:#fff;font-weight:600}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:7px}
li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.box.dim li::before{background:#555}
.fig{font-family:var(--serif);color:var(--red);font-size:1.22em}
.who-t{color:#fff;font-weight:600}
.reg{display:block;color:var(--tx3);font-size:.86em}
.modn{display:inline-block;font-family:var(--serif);font-size:.82em;letter-spacing:.06em;color:#fff;
  background:var(--red);border-radius:3px;padding:1px 7px;margin-right:7px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:1.6% 3.4%;flex:1;align-content:start}
.mods div{font-size:clamp(10.5px,.98cqw,14px);color:var(--tx2);padding:1.5% 0;border-bottom:1px solid #1e1e1e}
.mods .no{font-family:var(--serif);color:var(--red);margin-right:9px}
.teach-wrap{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
.teach-track{display:flex;gap:1.5%;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:1%}
.teach-track::-webkit-scrollbar{display:none}
.teach-card{flex:0 0 22.5%;scroll-snap-align:start;background:#f1f1f1;border-radius:7px;
  overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:inset 0 0 0 1px #dedede}
.teach-card img{width:100%;aspect-ratio:1.18;object-fit:cover;display:block;filter:grayscale(1) contrast(1.04)}
.teach-copy{padding:7% 7% 8%;display:flex;flex-direction:column;gap:6px;min-height:0}
.teach-copy b{display:block;color:#161616;font-family:var(--serif);font-weight:600;text-transform:uppercase;
  font-size:clamp(13px,1.35cqw,19px);line-height:1.1}
.teach-copy span{font-size:clamp(9.5px,.85cqw,12px);color:#4f4f4f;line-height:1.35}
.teach-copy i{font-style:normal;color:var(--red);font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.teach-nav{position:absolute;right:0;top:-58px;display:flex;gap:8px}
.teach-btn{width:38px;height:38px;border-radius:999px;border:1px solid #4a4a4a;background:#161616;color:#fff;
  font-family:var(--sans);font-size:18px;cursor:pointer;display:grid;place-items:center}
.teach-btn:hover{border-color:var(--red);background:var(--red)}
@media print{.teach-nav{display:none}.teach-track{overflow:hidden}.teach-card{flex-basis:23.8%}}
.empty{color:var(--tx3);text-align:center;padding:70px 20px;font-size:15px}

/* обложка — как первый и последний слайд в презентации школы */
.slide.cover{padding:0;background:linear-gradient(135deg,#d4142c 0%,#8a0818 100%)}
.cover .for{position:absolute;left:4.4%;top:8%;max-width:50%;font-family:var(--serif);
  font-size:clamp(14px,1.6cqw,22px);color:#fff;line-height:1.3}
.cover .for small{display:block;font-family:var(--sans);font-size:.5em;letter-spacing:.2em;
  text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:6px}
/* стоимость и рассрочка */
.price{font-family:var(--sans);font-weight:600;color:#fff;line-height:1;letter-spacing:-.02em;
  font-size:clamp(34px,5.4cqw,76px);margin:auto 0}
.price-note{font-size:clamp(10px,.85cqw,12px);letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600}
.incl{counter-reset:i}
.incl li{counter-increment:i;padding-left:34px;padding-bottom:2.2%;margin-bottom:2.2%;border-bottom:1px solid #262626}
.incl li::before{content:counter(i);background:none;border:1px solid #444;border-radius:999px;width:22px;height:17px;
  top:1px;font-family:var(--serif);font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}
.duo{margin-top:3%;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.duo .fig{font-size:clamp(20px,2.2cqw,30px)}
.todo{color:#ffb020;font-style:normal}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:3% 0 2.4%}
.week span{text-align:center;padding:7px 0;border-radius:4px;font-size:clamp(10px,.9cqw,13px);font-weight:600;letter-spacing:.08em}
.week .w{background:var(--red);color:#fff}
.week .o{background:#2a2a2a;color:var(--tx2)}
.wk-note{font-size:clamp(10.5px,.95cqw,13.5px);color:var(--tx2);line-height:1.45}
.wk-note b{color:#fff;font-weight:600}
.trj{width:100%;border-collapse:collapse;font-size:clamp(10.5px,.98cqw,14px)}
.trj td{padding:2.2% 2% 2.2% 0;border-bottom:1px solid #262626;vertical-align:top;color:var(--tx2)}
.trj td:first-child{color:#fff;width:46%}
.trj td:nth-child(2){white-space:nowrap}
/* пункты в столбик на всю высоту колонки */
.stack{display:flex;flex-direction:column}
.stack .st{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid #2a2a2a;padding:3% 0}
.stack h3+.st{border-top:none}
.stack .lbl{font-family:var(--serif);color:var(--red);font-size:clamp(14px,1.45cqw,20px);line-height:1.15;margin-bottom:1.5%}
.stack .st p{font-size:clamp(12px,1.2cqw,17px);color:#e6e6e6;line-height:1.42}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6%;flex:1;min-height:0}
.fmts .box{display:flex;flex-direction:column}
.fmts .price{font-size:clamp(24px,3cqw,42px);margin:auto 0 0}
/* преподаватели с фото */
.tph{display:grid;grid-template-columns:repeat(6,1fr);gap:2% 1.6%;flex:1;min-height:0;align-content:start}
.tph div{background:rgba(255,255,255,.03);border:1px solid #262626;border-radius:6px;padding:5%;
  font-size:clamp(8.5px,.74cqw,10.5px);color:var(--tx3);line-height:1.32}
.tph img{width:100%;aspect-ratio:1.3;object-position:50% 20%;object-fit:cover;border-radius:4px;display:block;margin-bottom:6%;background:#5a5a5a}
.tph b{display:block;color:#fff;font-family:var(--serif);font-weight:500;text-transform:uppercase;
  font-size:clamp(9.5px,.86cqw,12px);line-height:1.15;margin-bottom:3%}
.tph div span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.also{margin-top:1.6%;margin-bottom:2.4%;font-size:clamp(9.5px,.82cqw,11.5px);color:var(--tx3)}
.also b{color:var(--tx2);font-weight:500}
/* цифры */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3%}
.stat{background:rgba(255,255,255,.035);border-radius:6px;padding:7% 8%}
.stat .num{font-family:var(--serif);font-size:clamp(28px,3.6cqw,52px);line-height:1;color:#fff}
.stat .num.red{color:var(--red)}
.stat p{font-size:clamp(10.5px,.95cqw,13.5px);color:var(--tx2);margin-top:6%;line-height:1.35}
.res{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:3.4% 2.6%;flex:1;min-height:0}
.res .stat{border-left:2px solid var(--red);display:flex;flex-direction:column}
.res .stat .num{color:var(--red);font-size:clamp(24px,2.9cqw,42px)}
.res .stat small{margin-top:auto;padding-top:4%;font-size:clamp(9.5px,.8cqw,11.5px);color:var(--tx3)}
.res .stat small b{color:#fff;font-weight:600}
/* кейс */
.case{display:grid;grid-template-columns:1.25fr 1fr;gap:3.4%;flex:1;min-height:0}
.case .big{font-family:var(--serif);color:var(--red);font-size:clamp(34px,4.8cqw,68px);line-height:1}
.case .bigt{font-size:clamp(12px,1.15cqw,16px);color:#fff;margin-top:3%;max-width:90%}
.case .ph{width:34%;aspect-ratio:.8;object-fit:cover;border-radius:6px;float:right;margin:0 0 4% 5%}
.case .qt{font-family:var(--serif);font-size:clamp(13px,1.3cqw,18px);color:#fff;line-height:1.35;margin-top:auto}

@media print{
  @page{size:13.333in 7.5in;margin:0}
  body{background:#fff}
  .side,.panel,.noprint{display:none!important}
  .layout{display:block}
  .deck{max-width:none;padding:0;margin:0}
  .slide-stage{width:100vw;height:100vh;aspect-ratio:auto;margin:0;overflow:hidden;page-break-after:always;break-after:page}
  .slide-stage>.slide{position:relative;left:auto;top:auto;transform:none;width:100vw;height:100vh}
  .slide{border:none;border-radius:0;margin:0;page-break-after:always;break-after:page;
    width:100vw;height:100vh;aspect-ratio:auto;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:900px){.layout{display:block}.side{position:static;height:auto;max-height:52vh}}
.layout.nosb{grid-template-columns:1fr}
.layout.nosb .side{display:none}

/* EMBA: обложка и мелочи */
.cover .cv{position:absolute;left:6%;bottom:9%;right:6%}
.cover .cv small{display:block;font-size:clamp(10px,1cqw,14px);letter-spacing:.24em;text-transform:uppercase;color:#fff;opacity:.85;margin-bottom:2%}
.cover .cv .big{font-family:var(--serif);font-weight:500;text-transform:uppercase;color:#fff;line-height:.95;font-size:clamp(40px,8cqw,112px)}
.cover .cv p{font-family:var(--serif);color:#fff;font-size:clamp(15px,2cqw,28px);margin-top:2%}
.cover .bdg{position:absolute;right:5%;top:8%;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.cover .bdg span{border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:999px;padding:5px 12px;font-size:clamp(9px,.85cqw,12px);letter-spacing:.12em;text-transform:uppercase}
.qline{font-family:var(--serif);color:#fff;font-size:clamp(14px,1.5cqw,21px);line-height:1.3;border-bottom:1px solid #2a2a2a;padding-bottom:3%;margin-bottom:1%}
.qline small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:2% 3%}
.tracks div{font-size:clamp(11px,1cqw,14px);color:var(--tx2);border-bottom:1px solid #222;padding:2% 0}
.tracks div b{color:#fff;font-weight:600}
.mods.col{grid-auto-flow:column;grid-template-rows:repeat(9,auto)}
.dense .st{padding:1.4% 0!important}
.dense .lbl{font-size:clamp(11px,1.05cqw,15px)!important}
.dense .st p{font-size:clamp(10px,.92cqw,13px)!important}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6%;flex:1;min-height:0}
.steps .box{display:flex;flex-direction:column}
.steps .n{font-family:var(--serif);color:var(--red);font-size:clamp(28px,3.6cqw,52px);line-height:1;margin-bottom:6%}

/* 2026 update: visual system of the current Executive MBA materials */
@font-face{font-family:Synergy;src:url('assets/fonts/SynergySans-Light.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:Synergy;src:url('assets/fonts/SynergySans-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Synergy;src:url('assets/fonts/SynergySans-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:Synergy;src:url('assets/fonts/SynergySans-SemiBold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Synergy;src:url('assets/fonts/SynergySans-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:Synergy;src:url('assets/fonts/SynergySans-Black.otf') format('opentype');font-weight:900;font-style:normal;font-display:swap}
:root{--red:#ef2b20;--tx:#191919;--tx2:#4c4c4c;--tx3:#777;--card:#f1f1f1;--line:#d5d5d5;
  --serif:'Synergy','Arial Narrow',Impact,sans-serif;--sans:'Synergy',Arial,sans-serif}
body{background:#dedede;color:var(--tx);font-weight:400}
.side{--tx:#f2f2f2;--tx2:#b9b9b9;--tx3:#7a7a7a;--card:#1c1c1c;--line:#2c2c2c}
.slide{background:#fff;border:3px solid #191919}
.slide h1,.slide h2{font-weight:900;line-height:.96}
.slide h3{font-weight:600}
.slide .mark::before{color:var(--red)}
.quote{color:var(--tx);font-weight:900;line-height:1.22}
.box{background:var(--card);border-left:4px solid var(--red)}
.box.dim{background:#fff;border:1px solid var(--line);border-left:4px solid #222}
.box b,.who-t,.teach b,.res .stat small b,.tracks div b,.also b{color:var(--tx)}
.mods div{border-bottom-color:#ddd}
.slide.cover{background:var(--red);border-color:var(--red)}
.cover .cv .big{font-weight:900}
.cover .for small{color:#fff;opacity:.75}
.price{color:var(--tx)}
.incl li{border-bottom-color:#d8d8d8}
.incl li::before{border-color:#888;color:var(--tx)}
.wk-note b,.trj td:first-child{color:var(--tx)}
.trj td,.stack .st{border-color:#d2d2d2}
.stack .st p,.case .bigt,.case .qt{color:var(--tx)}
.stat{background:#f0f0f0}
.stat .num{color:var(--tx);font-weight:900}
.stats .stat:nth-child(4) .num{font-size:clamp(19px,2.3cqw,33px)}
.qline{color:var(--tx);border-bottom-color:#ccc;font-weight:900}
.tracks div{border-bottom-color:#ddd}

/* interview evidence, intensive photography and the official calendar */
.evidence{display:grid;grid-template-columns:1.08fr .92fr;gap:3%;flex:1;min-height:0}
.evidence-photo{width:100%;height:100%;object-fit:cover;border-radius:6px;filter:saturate(.88) contrast(1.04)}
.owners-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.6%;align-content:stretch}
.owner-quote{background:#f1f1f1;border-top:5px solid var(--red);padding:7%;display:flex;flex-direction:column;justify-content:space-between}
.owner-quote blockquote{font-family:var(--serif);font-weight:900;font-size:clamp(15px,1.55cqw,22px);line-height:1.14;text-transform:uppercase}
.owner-quote small{margin-top:8%;color:var(--tx3);font-size:clamp(9px,.75cqw,11px)}
.intensive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2%;flex:1;min-height:0}
.intensive-card{position:relative;min-height:0;overflow:hidden;background:#111;border-radius:5px}
.intensive-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.intensive-card div{position:absolute;left:0;right:0;bottom:0;padding:18% 7% 7%;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.intensive-card b{display:block;font-family:var(--serif);font-weight:900;font-size:clamp(16px,1.7cqw,24px);line-height:1;text-transform:uppercase}
.intensive-card span{font-size:clamp(9px,.8cqw,12px)}
.fullimg{padding:0;background:#fff;border-color:#191919}
.fullimg img{width:100%;height:100%;object-fit:contain;display:block}
.module-results{display:grid;grid-template-columns:1fr 1fr;gap:2.2% 3.2%;flex:1;min-height:0;align-content:stretch}
.module-result{border-top:3px solid var(--red);padding:2.2% 1% 0;display:grid;grid-template-columns:42px 1fr;gap:3%}
.module-result .mn{font-family:var(--serif);font-weight:900;color:var(--red);font-size:clamp(22px,2.5cqw,34px);line-height:1}
.module-result b{display:block;font-size:clamp(10.5px,1.02cqw,14px);line-height:1.15;margin-bottom:1.8%}
.module-result p{font-size:clamp(9px,.78cqw,11.5px);line-height:1.28;color:var(--tx2)}
.photo-strip{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:1.5%;height:34%;margin-top:2%}
.photo-strip img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.task-meta{display:grid;grid-template-columns:1.12fr .88fr;gap:4%}
.task-meta li{font-size:clamp(9.5px,.82cqw,12px);line-height:1.28;margin-bottom:5px}
.task-case p{font-size:clamp(10px,.9cqw,13px);line-height:1.35}

/*
  EMBA visual-system invariants
  - Synergy Sans is the only presentation typeface; every used weight maps to a real local font file.
  - All slides share one 5.5% horizontal grid and one logo/footer axis.
  - Program architecture stays dark; graduate evidence switches to a light editorial surface.
  - Display type is optically tight. Tracking expands only on short service labels.
  - The official School of Business lockup appears on every slide without distortion.
*/
:root{
  --deck-x:5.5%;
  --deck-y:4.8%;
  --deck-footer-y:3.4%;
  --tracking-display:-.025em;
  --tracking-label:.1em;
  --case-paper:#f3f1ec;
  --case-ink:#171717;
  --case-muted:#6d6963;
}
.slide:not(.cover){padding:var(--deck-y) var(--deck-x)}
.slide h1,.slide h2,.contact-title,.cover .cv .big{letter-spacing:var(--tracking-display)}
.slide p,.slide li,.slide b,.slide span{font-kerning:normal}
.kick,.block-head span,.task-action small,.module-panel-item strong,.audience-sectors>span,.cal-tag{letter-spacing:var(--tracking-label)}
.slide .mark{top:4.6%;right:var(--deck-x);width:126px}
.slide .ft{left:var(--deck-x);right:var(--deck-x);bottom:var(--deck-footer-y)}
.cover-mark{right:var(--deck-x);top:5%;width:150px}
.slide .mark img,.cover-mark{object-fit:contain}

/* Keep the complete two-column module list inside the shared slide frame. */
.modules-overview-slide .mods.col{grid-template-rows:repeat(9,minmax(0,1fr));align-content:stretch;min-height:0}
.modules-overview-slide .mods div{display:flex;align-items:center;min-height:0;font-size:clamp(16px,1.18cqw,18px);line-height:1.12;padding:.8% 0}

/* The one intentionally light community slide uses the same page and grid system. */
.slide.club-slide{padding:var(--deck-y) var(--deck-x);background:var(--case-paper)}

/*
  Unified header hierarchy
  - Titles start the reading order on the left edge of the shared grid.
  - The school lockup stays in the service zone and begins slightly below the
    top of the first title line, never above it.
  - Long titles keep a clear buffer before the lockup.
*/
:root{
  --header-logo-width:100px;
  --header-logo-top:10%;
  --header-logo-gap:50px;
}
.slide .mark{
  top:var(--header-logo-top);
  width:var(--header-logo-width);
  padding:5px 7px;
}
.dark-slide .mark{
  width:var(--header-logo-width);
  padding:0;
}
.slide:not(.cover)>h2{
  max-width:calc(100% - var(--header-logo-width) - var(--header-logo-gap));
}
.task-block-slide .mark,
.block-case-slide .mark{
  top:16%;
}
.task-block-slide .block-head>div:last-child,
.block-case-slide .block-head>div:last-child{
  padding-right:calc(var(--header-logo-width) + var(--header-logo-gap));
}
.block-case-slide .mark{
  top:14.2%;
}
.club-slide .mark{
  top:13.2%;
}
.price-slide .mark{
  top:18.5%;
}
.cover-mark{
  top:6%;
  width:118px;
}

function scrollTeach(btn,dir){
  const t=btn.closest('.slide').querySelector('.teach-track');
  if(!t)return;
  const card=t.querySelector('.teach-card');
  const gap=parseFloat(getComputedStyle(t).columnGap)||0;
  t.scrollBy({left:dir*((card?.getBoundingClientRect().width||t.clientWidth/4)+gap)*4,behavior:'smooth'});
}
function showModule(btn,n){
  const panel=btn.closest('.module-zone').querySelector('.module-panel');
  const data=MOD_RESULTS[n];
  panel.querySelector('b').textContent=data[0];
  panel.querySelector('p').textContent=data[1];
  panel.classList.add('open');
}
function showModules(btn,csv){
  const slide=btn.closest('.task-block-slide');

  const ids=csv.split(',').map(Number);
  panel.classList.remove('compact');

  panel.classList.add('open');
  if(panel.scrollHeight>panel.clientHeight+1)panel.classList.add('compact');
}

    <div class="price-details"><h2>В стоимость входит</h2><div class="price-includes"><span>16 модулей за 2 года</span><span>Бизнес-миссии в 6 стран</span><span>Клуб MBA и мероприятия каждый месяц</span><span>Выпускной проект по своей компании</span><span>Группа из собственников бизнеса</span><span>8 треков развития</span></div></div>
    </div></section>`);

  const EARLY_OFF=.11, DUO_OFF=.23;
  const early=PRICE*(1-EARLY_OFF), duo=PRICE*(1-DUO_OFF);
  add(n=>`<section class="slide dark-slide discount-slide">${ft(n)}<div class="discount-layout"><figure class="discount-photo"><img src="design-img/photos/kicker4-early-group.jpg" alt="Участники ближайшего потока" style="object-position:50% 43%"></figure><div class="discount-copy"><div class="kick">Стоимость</div><h2>Ближайший поток — скидка 11%</h2><div class="discount-old">${rub(PRICE)}</div><div class="discount-new">${rub(early)}</div><div class="discount-saving">Экономия ${rub(PRICE-early)}</div><p class="discount-note">Скидка не суммируется со скидкой «с бизнес-партнёром».</p></div></div></section>`);

  add(n=>`<section class="slide dark-slide discount-slide">${ft(n)}<div class="discount-layout"><figure class="discount-photo"><img src="design-img/photos/duo-graduates.jpg" alt="Бизнес-партнёры на программе" style="object-position:50% 38%"></figure><div class="discount-copy"><div class="kick">Стоимость</div><h2>С бизнес-партнёром — скидка 23%</h2><div class="discount-old">${rub(PRICE)}</div><div class="discount-new">${rub(duo)}</div><div class="discount-saving">Стоимость на одного участника · экономия ${rub(PRICE-duo)}</div></div></div></section>`);

  add(n=>`<section class="slide dark-slide contact-slide">${ft(n)}<div class="contact-layout">
    <div><div class="kick">Следующий шаг</div><div class="contact-title">Ответим на ваши вопросы</div></div>
    <div class="contact-card"><b>${mgr}</b><span>${phone}</span><a href="mailto:${email}">${email}</a><small>Школа бизнеса «Синергия»<br>БЦ White Stone, 4-й Лесной переулок, 4, Москва</small></div>
    </div></section>`);

  d.innerHTML=S.map((f,i)=>`<div class="slide-stage">${f(i+1)}</div>`).join('');
  fitSlides();
  slideCount=S.length;cnt();
}

function fitSlides(){
  document.querySelectorAll('.slide-stage').forEach(stage=>{
    stage.style.setProperty('--slide-scale',String(stage.clientWidth/960));
  });
}
new ResizeObserver(fitSlides).observe(document.getElementById('deck'));

const qs=new URLSearchParams(location.search);
if(qs.get('p'))qs.get('p').split(',').filter(Boolean).forEach(k=>ITEMS.find(i=>i.k===k)&&sel.add(k));
else ITEMS.forEach(i=>sel.add(i.k));
if(qs.get('nm'))document.getElementById('nm').value=qs.get('nm');
if(qs.get('co'))document.getElementById('co').value=qs.get('co');
if(qs.get('mgr'))document.getElementById('mgr').value=qs.get('mgr');
if(qs.get('phone'))document.getElementById('phone').value=qs.get('phone');
if(qs.get('email'))document.getElementById('email').value=qs.get('email');
const _tog=tog;
picks();render();

</script>
