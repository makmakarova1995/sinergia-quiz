<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Персональная презентация — MBA Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#FF003D;--tx:#f2f2f2;--tx2:#b9b9b9;--tx3:#7a7a7a;--card:#1C1C1C;--line:#2c2c2c;
  --serif:'Playfair Display','Times New Roman',Georgia,serif;
  --sans:'Manrope','Inter',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#111;color:var(--tx);font-weight:300;line-height:1.5}

/* ── панель сборки (не печатается) ── */
.panel{background:#161616;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:99}
.panel-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel .ttl{font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx2);white-space:nowrap}
.who{display:flex;gap:7px;flex-wrap:wrap}
.who input{background:#0d0d0d;border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  color:#fff;font-family:var(--sans);font-size:13px;width:140px;outline:none}
.who input:focus{border-color:var(--red)}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-left:auto}
.btn{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
  padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--red);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cnt{color:var(--tx3);font-size:12.5px;white-space:nowrap}
.cnt b{color:#fff}
.drawer{max-width:1180px;margin:0 auto;padding:0 20px;overflow:hidden;max-height:0;transition:max-height .22s ease}
.drawer.open{max-height:460px;overflow-y:auto;padding-bottom:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;padding-top:4px}
.pick{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13px;color:var(--tx2);transition:.14s}
.pick:hover{border-color:#444}
.pick.on{border-color:var(--red);color:#fff;background:#1f1517}
.pick input{accent-color:var(--red);margin-top:2px;flex:none}

/* ── слайды ── */
.deck{max-width:1180px;margin:0 auto;padding:16px 20px 50px}
.slide{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#353535 0%,#0a0a0a 55%,#000 100%);
  border:1px solid #242424;border-radius:10px;padding:5.2% 6%;margin-bottom:18px;overflow:hidden;
  display:flex;flex-direction:column}
.slide .mark{position:absolute;top:4.4%;right:5%;width:30px;height:30px;border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center}
.slide .mark::before{content:'❮';color:#fff;font-size:12px}
.slide .ft{position:absolute;bottom:4%;left:6%;right:6%;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a4a4a}
.kick{color:var(--red);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.slide h1{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.04;
  font-size:clamp(26px,3.6vw,50px)}
.slide h2{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.08;
  font-size:clamp(20px,2.5vw,34px);margin-bottom:18px}
.slide h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  font-weight:600;margin-bottom:9px}
.quote{font-family:var(--serif);font-size:clamp(17px,2vw,27px);line-height:1.34;color:#fff;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3.4%;flex:1;min-height:0}
.box{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3.4% 3.8%}
.box.dim{border-left-color:#4a4a4a}
.box p,.box li{font-size:clamp(11.5px,1.07vw,15px);color:var(--tx2);line-height:1.5}
.box b{color:#fff;font-weight:600}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:7px}
li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.box.dim li::before{background:#555}
.fig{font-family:var(--serif);color:var(--red);font-size:1.22em}
.who-t{color:#fff;font-weight:600}
.reg{display:block;color:var(--tx3);font-size:.86em}
.modn{display:inline-block;font-family:var(--serif);font-size:.82em;letter-spacing:.06em;color:#fff;
  background:var(--red);border-radius:3px;padding:1px 7px;margin-right:7px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:1.6% 3.4%;flex:1;align-content:start}
.mods div{font-size:clamp(10.5px,.98vw,14px);color:var(--tx2);padding:1.5% 0;border-bottom:1px solid #1e1e1e}
.mods .no{font-family:var(--serif);color:var(--red);margin-right:9px}
.teach{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4% 3%;flex:1;align-content:start}
.teach div{font-size:clamp(10px,.92vw,13px);color:var(--tx3);line-height:1.38}
.teach b{display:block;color:#fff;font-weight:600;font-size:1.1em;margin-bottom:3px;
  font-family:var(--serif);text-transform:uppercase;letter-spacing:.02em}
.empty{color:var(--tx3);text-align:center;padding:70px 20px;font-size:15px}

@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .panel,.noprint{display:none!important}
  .deck{max-width:none;padding:0;margin:0}
  .slide{border:none;border-radius:0;margin:0;page-break-after:always;break-after:page;
    width:100vw;height:100vh;aspect-ratio:auto;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="panel noprint"><div class="panel-in">
  <span class="ttl">Презентация для работодателя</span>
  <div class="who">
    <input id="nm" placeholder="Имя клиента" oninput="render()">
    <input id="co" placeholder="Компания" oninput="render()">
  </div>
  <div class="acts">
    <span class="cnt" id="cnt"></span>
    <button class="btn" onclick="dr()">Задачи ▾</button>
    <button class="btn" onclick="all(true)">Все</button>
    <button class="btn" onclick="all(false)">Снять</button>
    <button class="btn pri" onclick="window.print()">Сохранить в PDF</button>
  </div>
</div>
<div class="drawer" id="drawer"><div class="picks" id="picks"></div></div></div>

<div class="deck" id="deck"></div>

 ['Зоя Стрелкова','Руководитель направления «Экономика компании» ГК «Институт Тренинга — АРБ Про». Считает экономику и инвестпроекты для компаний разных отраслей'],
 ['Сергей Чумак','Независимый директор, руководитель комитета по стратегии Ассоциации практиков цифровизации. Внедряет цифровые модели в промышленности'],

 ['Владислава Друтько','Партнёр Школы бизнеса «Синергия», эксперт по лидерству и управлению персоналом'],

 ['Виталий Новиков','Эксперт по продажам и клиентскому сервису, выстраивает коммерческие системы']

const ITEMS=[
{k:'roi',t:'Сократить расходы на привлечение клиентов',

{k:'proc',t:'Навести порядок в процессах, убрать потери',

 mods:[[10,'Фридман']],
 who:[['Александр Фридман','управляющий партнёр Amadeus Group']],
 case:'<b>Андрей Исаев</b>, сооснователь и гендиректор ДНКОМ — сеть медицинских лабораторий, выручка 2,7 млрд ₽. Врач по образованию: управление держалось на интуиции. Пересобрал команду, пересмотрел KPI и перестроил найм по технологиям с программы'},

{k:'fot',t:'Снизить долю ФОТ, переделать систему оплаты труда',
 q:'«Фонд оплаты растёт быстрее выработки, а сокращать некого»',

     '<b>В работе:</b> платят за результат, а не за присутствие; есть мотивация и без повышения окладов',

 q:'«Мы реагируем на рынок с опозданием, решения принимаем по вчерашним данным»',
 ch:['<b>Научится</b> сканировать тренды и оценивать макрориски: ставка, инфляция, санкционное давление',
     '<b>В работе:</b> видит разворот рынка раньше, чем он придёт в отчёты',
     '<b>Деньги компании:</b> вход в новые направления до того, как туда зашли конкуренты'],
 mods:[[2,'Еремина, Богданов']],
 who:[['Ольга Еремина','основатель Pro-trendwatching'],['Дмитрий Богданов','макроэкономические исследования']],
 case:'<b>Анастасия Юдицкая</b>, основательница Pirouette — сети школ художественной гимнастики в Москве, Подмосковье и Петербурге. «Учёба в бизнес-школе помогла мне принять решение о выходе на зарубежные рынки» — открыла направление в ОАЭ'},

{k:'speak',t:'Научиться защищать решения перед советом директоров',
 q:'«Руководители не умеют защищать свои решения — я трачу время на разбор очевидного»',
 ch:['<b>Научится</b> готовить и защищать решения: структура выступления, управление вниманием зала',
     '<b>В работе:</b> доводит решения до утверждения с первого раза, без лишних кругов',
     '<b>Деньги компании:</b> решения принимаются быстрее, меньше циклов согласования'],
 mods:[[12,'Друтько']],
 who:[['Владислава Друтько','партнёр Школы бизнеса «Синергия»']],
 case:'<b>Денис Ременяко</b>, владелец и гендиректор «ФК Гранд Капитал» — четвёртый фармдистрибьютор России, оборот 250 млрд ₽. Поставил публичные выступления: перешёл от импровизации к жёсткой структуре речи'}
];

const FIN={
 roi:'<b>Научится считать P&amp;L направления:</b> куда уходит бюджет и что реально приносит прибыль',
 proc:'<b>Увидит, где компания теряет деньги</b>, и покажет это цифрами, а не ощущениями',
 deleg:'<b>Погрузится в рутину управления</b> и начнёт растить сильных сотрудников, а не тянуть всё сам',
 fot:'<b>Научится управлять фондом оплаты:</b> платить за результат, а не за присутствие',
 budget:'<b>Будет приходить с решениями, а не с вопросами</b> — с расчётом, сколько стоит и когда окупится',
 strat:'<b>Сможет видеть, как масштабировать бизнес</b> — станет советником, а не исполнителем, которому надо объяснять, что делать',
 ai:'<b>Узнает, как внедрить нейросети для ускорения работы</b>, и поставит их на конкретные операции',
 change:'<b>Научится доводить изменения до конца</b>, а не до совещания',
 sales:'<b>Построит систему продаж</b>, которая не рухнет с уходом сильного продавца',
 trend:'<b>Научится видеть, куда идёт рынок</b>, раньше, чем это станет видно по отчётам',
 speak:'<b>Научится защищать решения</b> так, чтобы их утверждали с первого раза'
};

const sel=new Set();

function picks(){
  document.getElementById('picks').innerHTML=ITEMS.map(it=>
    `<label class="pick${sel.has(it.k)?' on':''}" data-k="${it.k}">
      <input type="checkbox" ${sel.has(it.k)?'checked':''} onchange="tog('${it.k}')">
      <span>${it.t}</span></label>`).join('');
  document.getElementById('cnt').innerHTML=sel.size?`Задач <b>${sel.size}</b> · слайдов <b>${sel.size+4}</b>`:'Задачи не отмечены';
}
function tog(k){sel.has(k)?sel.delete(k):sel.add(k);picks();render()}
function dr(){document.getElementById('drawer').classList.toggle('open')}
function all(v){sel.clear();if(v)ITEMS.forEach(i=>sel.add(i.k));picks();render()}

function ft(n){
  return `<div class="ft"><span>MBA Foundation · Школа бизнеса «Синергия»</span><span>${n}</span></div><div class="mark"></div>`;
}

function render(){
  const nm=document.getElementById('nm').value.trim();
  const co=document.getElementById('co').value.trim();
  const list=ITEMS.filter(i=>sel.has(i.k));
  const d=document.getElementById('deck');
  if(!list.length){d.innerHTML='<p class="empty noprint">Отметьте задачи клиента выше — презентация соберётся здесь.</p>';return}

  let n=0, out='';

  // 1 · титул
  n++;
  out+=`<section class="slide">${ft(n)}
    <div style="margin:auto 0">
      <div class="kick">Школа бизнеса «Синергия» · с 1988 года</div>
      <h1>MBA<br>Foundation</h1>
      <p style="color:var(--tx2);margin-top:18px;max-width:62%;font-size:clamp(12px,1.15vw,16px)">
        Первая ступень бизнес-образования для топ-менеджеров и собственников.
        12 модулей, выездной модуль в Дубае, индивидуальный коучинг.</p>
      ${(nm||co)?`<p style="margin-top:24px;font-family:var(--serif);font-size:clamp(14px,1.5vw,21px);color:#fff">
        ${nm?nm:''}${nm&&co?' · ':''}${co?co:''}</p>`:''}
    </div></section>`;

  // 2..N · по слайду на задачу
  list.forEach(it=>{
    n++;
    const mods=it.mods.map(m=>`<li><span class="modn">модуль ${m[0]}</span>${MODULES[m[0]-1]}</li>`).join('');
    const who=it.who.map(w=>`<li><span class="who-t">${w[0]}</span><span class="reg">${w[1]}</span></li>`).join('');
    out+=`<section class="slide">${ft(n)}
      <div class="kick">Задача компании</div>
      <h2>${it.t}</h2>
      <p class="quote" style="margin-bottom:3.4%">${it.q}</p>
      <div class="cols">
        <div class="box">
          <h3>Что изменится у вас</h3>
          <ul>${it.ch.map(c=>`<li>${c}</li>`).join('')}</ul>
        </div>
        <div>
          <div class="box dim" style="margin-bottom:3%">
            <h3>Модуль</h3>
            <ul>${mods}</ul>
            <h3 style="margin-top:4%">Кто ведёт</h3>
            <ul>${who}</ul>
          </div>
          <div class="box">
            <h3>Результат на обучении MBA</h3>
            <p>${it.case}</p>
          </div>
        </div>
      </div></section>`;
  });

  // N+1 · все модули
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Программа целиком</div>
    <h2>12 модулей</h2>
    <div class="mods">${MODULES.map((m,i)=>
      `<div><span class="no">${String(i+1).padStart(2,'0')}</span>${m}</div>`).join('')}</div>
    </section>`;

  // N+2 · преподаватели
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Практики, а не теоретики</div>
    <h2>Преподаватели</h2>
    <div class="teach">${TEACHERS.map(t=>`<div><b>${t[0]}</b>${t[1]}</div>`).join('')}</div>
    </section>`;


  // финал · что изменится в компании во время обучения
  n++;
  const names=list.map(i=>FIN[i.k]||i.t);
  const tm=[...new Set(list.flatMap(i=>i.who.map(w=>w[0]+' — '+w[1])))].slice(0,4);
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Итог</div>
    <h2>Что изменится в вашей компании<br>во время обучения сотрудника</h2>
    <div class="cols">
      <div class="box">
        <h3>Какие задачи он сможет закрыть</h3>
        <ul>${names.map(x=>`<li>${x}</li>`).join('')}</ul>
        <p style="margin-top:4%">Каждый модуль заканчивается <b>рабочим артефактом по вашей компании</b>: картой процессов, расчётом окупаемости, регламентом делегирования. Их внедряют по ходу, а не после выпуска.</p>
      </div>
      <div>
        <div class="box dim" style="margin-bottom:3%">
          <h3>Так это работает у других</h3>
          <ul>
            <li><b>Кузяков</b>, «Ванюшкины сладости»: внедрял после каждого модуля — маржинальность <span class="fig">+5–7%</span>, нейросети на контроле качества</li>
            <li><b>Нищев</b>, «Башинформсвязь»: дипломная работа по своей компании дала <span class="fig">200 млн ₽</span> экономии в год</li>
            <li><b>Волкова</b>, «Газпромбанк Автолизинг»: довела проект до результата <span class="fig">ещё до диплома</span></li>
          </ul>
        </div>
        <div class="box">
          <h3>Траектория под вас</h3>
          <p>Составим <b>порядок модулей под ваши задачи</b> и тему выпускного проекта${tm.length?`. Разбирать их будут ${tm.slice(0,2).map(t=>t.split(' — ')[0]).join(' и ')}`:''}. Проект делается по вашей компании — <b>результат остаётся у вас</b>, а не уходит вместе с дипломом.</p>
        </div>
      </div>
    </div></section>`;

  d.innerHTML=out;
}

// подхват отметок из диагностики
try{
  const pre=JSON.parse(localStorage.getItem('deckPicks')||'[]');
  pre.forEach(k=>sel.add(k));
}catch(e){}
const qs=new URLSearchParams(location.search);
if(qs.get('p'))qs.get('p').split(',').filter(Boolean).forEach(k=>sel.add(k));
if(qs.get('nm'))document.addEventListener('DOMContentLoaded',()=>document.getElementById('nm').value=qs.get('nm'));

picks();render();
if(!sel.size)document.getElementById('drawer').classList.add('open');
</script>
</body>
</html>
