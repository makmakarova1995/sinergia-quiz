<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Персональная презентация — MBA Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#FF003D;--tx:#f2f2f2;--tx2:#b9b9b9;--tx3:#7a7a7a;--card:#1C1C1C;--line:#2c2c2c;
  --serif:'Playfair Display','Times New Roman',Georgia,serif;
  --sans:'Manrope','Inter',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#111;color:var(--tx);font-weight:300;line-height:1.5}

/* ── панель сборки (не печатается) ── */
.panel{background:#161616;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:99}
.panel-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel .ttl{font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx2);white-space:nowrap}
.who{display:flex;gap:7px;flex-wrap:wrap}
.who input{background:#0d0d0d;border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  color:#fff;font-family:var(--sans);font-size:13px;width:140px;outline:none}
.who input:focus{border-color:var(--red)}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-left:auto}
.btn{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
  padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--red);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cnt{color:var(--tx3);font-size:12.5px;white-space:nowrap}
.cnt b{color:#fff}
.drawer{max-width:1180px;margin:0 auto;padding:0 20px;overflow:hidden;max-height:0;transition:max-height .22s ease}
.drawer.open{max-height:460px;overflow-y:auto;padding-bottom:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;padding-top:4px}
.pick{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13px;color:var(--tx2);transition:.14s}
.pick:hover{border-color:#444}
.pick.on{border-color:var(--red);color:#fff;background:#1f1517}
.pick input{accent-color:var(--red);margin-top:2px;flex:none}

/* ── слайды ── */
.deck{max-width:1180px;margin:0 auto;padding:16px 20px 50px}
.slide{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#353535 0%,#0a0a0a 55%,#000 100%);
  border:1px solid #242424;border-radius:10px;padding:5.2% 6%;margin-bottom:18px;overflow:hidden;
  display:flex;flex-direction:column}
.slide .mark{position:absolute;top:4.4%;right:5%;width:30px;height:30px;border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center}
.slide .mark::before{content:'❮';color:#fff;font-size:12px}
.slide .ft{position:absolute;bottom:4%;left:6%;right:6%;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a4a4a}
.kick{color:var(--red);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.slide h1{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.04;
  font-size:clamp(26px,3.6vw,50px)}
.slide h2{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.08;
  font-size:clamp(20px,2.5vw,34px);margin-bottom:18px}
.slide h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  font-weight:600;margin-bottom:9px}
.quote{font-family:var(--serif);font-size:clamp(17px,2vw,27px);line-height:1.34;color:#fff;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3.4%;flex:1;min-height:0}
.box{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3.4% 3.8%}
.box.dim{border-left-color:#4a4a4a}
.box p,.box li{font-size:clamp(11.5px,1.07vw,15px);color:var(--tx2);line-height:1.5}
.box b{color:#fff;font-weight:600}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:7px}
li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.box.dim li::before{background:#555}
.fig{font-family:var(--serif);color:var(--red);font-size:1.22em}
.who-t{color:#fff;font-weight:600}
.reg{display:block;color:var(--tx3);font-size:.86em}
.modn{display:inline-block;font-family:var(--serif);font-size:.82em;letter-spacing:.06em;color:#fff;
  background:var(--red);border-radius:3px;padding:1px 7px;margin-right:7px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:1.6% 3.4%;flex:1;align-content:start}
.mods div{font-size:clamp(10.5px,.98vw,14px);color:var(--tx2);padding:1.5% 0;border-bottom:1px solid #1e1e1e}
.mods .no{font-family:var(--serif);color:var(--red);margin-right:9px}
.teach{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4% 3%;flex:1;align-content:start}
.teach div{font-size:clamp(10px,.92vw,13px);color:var(--tx3);line-height:1.38}
.teach b{display:block;color:#fff;font-weight:600;font-size:1.1em;margin-bottom:3px;
  font-family:var(--serif);text-transform:uppercase;letter-spacing:.02em}
.empty{color:var(--tx3);text-align:center;padding:70px 20px;font-size:15px}

/* обложка — как первый и последний слайд в презентации школы */
.slide.cover{padding:0;background:#000 url(design-img/fmba-cover.jpg) center/cover no-repeat}
.cover .for{position:absolute;left:4.4%;top:8%;max-width:50%;font-family:var(--serif);
  font-size:clamp(14px,1.6vw,22px);color:#fff;line-height:1.3}
.cover .for small{display:block;font-family:var(--sans);font-size:.5em;letter-spacing:.2em;
  text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:6px}
/* стоимость и рассрочка */
.price{font-family:var(--sans);font-weight:600;color:#fff;line-height:1;letter-spacing:-.02em;
  font-size:clamp(34px,5.4vw,76px);margin:auto 0}
.price-note{font-size:clamp(10px,.85vw,12px);letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600}
.incl{counter-reset:i}
.incl li{counter-increment:i;padding-left:34px;padding-bottom:2.2%;margin-bottom:2.2%;border-bottom:1px solid #262626}
.incl li::before{content:counter(i);background:none;border:1px solid #444;border-radius:999px;width:22px;height:17px;
  top:1px;font-family:var(--serif);font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}
.duo{margin-top:3%;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.duo .fig{font-size:clamp(20px,2.2vw,30px)}
.todo{color:#ffb020;font-style:normal}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:3% 0 2.4%}
.week span{text-align:center;padding:7px 0;border-radius:4px;font-size:clamp(10px,.9vw,13px);font-weight:600;letter-spacing:.08em}
.week .w{background:var(--red);color:#fff}
.week .o{background:#2a2a2a;color:var(--tx2)}
.wk-note{font-size:clamp(10.5px,.95vw,13.5px);color:var(--tx2);line-height:1.45}
.wk-note b{color:#fff;font-weight:600}
.trj{width:100%;border-collapse:collapse;font-size:clamp(10.5px,.98vw,14px)}
.trj td{padding:2.2% 2% 2.2% 0;border-bottom:1px solid #262626;vertical-align:top;color:var(--tx2)}
.trj td:first-child{color:#fff;width:46%}
.trj td:nth-child(2){white-space:nowrap}
/* пункты в столбик на всю высоту колонки */
.stack{display:flex;flex-direction:column}
.stack .st{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid #2a2a2a;padding:3% 0}
.stack h3+.st{border-top:none}
.stack .lbl{font-family:var(--serif);color:var(--red);font-size:clamp(14px,1.45vw,20px);line-height:1.15;margin-bottom:1.5%}
.stack .st p{font-size:clamp(12px,1.2vw,17px);color:#e6e6e6;line-height:1.42}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6%;flex:1;min-height:0}
.fmts .box{display:flex;flex-direction:column}
.fmts .price{font-size:clamp(24px,3vw,42px);margin:auto 0 0}
/* преподаватели с фото */
.tph{display:grid;grid-template-columns:repeat(6,1fr);gap:2% 1.6%;flex:1;min-height:0;align-content:start}
.tph div{background:rgba(255,255,255,.03);border:1px solid #262626;border-radius:6px;padding:5%;
  font-size:clamp(8.5px,.74vw,10.5px);color:var(--tx3);line-height:1.32}
.tph img{width:100%;aspect-ratio:1.3;object-position:50% 20%;object-fit:cover;border-radius:4px;display:block;margin-bottom:6%;background:#5a5a5a}
.tph b{display:block;color:#fff;font-family:var(--serif);font-weight:500;text-transform:uppercase;
  font-size:clamp(9.5px,.86vw,12px);line-height:1.15;margin-bottom:3%}
.tph div span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.also{margin-top:1.6%;margin-bottom:2.4%;font-size:clamp(9.5px,.82vw,11.5px);color:var(--tx3)}
.also b{color:var(--tx2);font-weight:500}
/* цифры */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3%}
.stat{background:rgba(255,255,255,.035);border-radius:6px;padding:7% 8%}
.stat .num{font-family:var(--serif);font-size:clamp(28px,3.6vw,52px);line-height:1;color:#fff}
.stat .num.red{color:var(--red)}
.stat p{font-size:clamp(10.5px,.95vw,13.5px);color:var(--tx2);margin-top:6%;line-height:1.35}
.res{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:3.4% 2.6%;flex:1;min-height:0}
.res .stat{border-left:2px solid var(--red);display:flex;flex-direction:column}
.res .stat .num{color:var(--red);font-size:clamp(24px,2.9vw,42px)}
.res .stat small{margin-top:auto;padding-top:4%;font-size:clamp(9.5px,.8vw,11.5px);color:var(--tx3)}
.res .stat small b{color:#fff;font-weight:600}
/* кейс */
.case{display:grid;grid-template-columns:1.25fr 1fr;gap:3.4%;flex:1;min-height:0}
.case .big{font-family:var(--serif);color:var(--red);font-size:clamp(34px,4.8vw,68px);line-height:1}
.case .bigt{font-size:clamp(12px,1.15vw,16px);color:#fff;margin-top:3%;max-width:90%}
.case .ph{width:34%;aspect-ratio:.8;object-fit:cover;border-radius:6px;float:right;margin:0 0 4% 5%}
.case .qt{font-family:var(--serif);font-size:clamp(13px,1.3vw,18px);color:#fff;line-height:1.35;margin-top:auto}

@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .panel,.noprint{display:none!important}
  .deck{max-width:none;padding:0;margin:0}
  .slide{border:none;border-radius:0;margin:0;page-break-after:always;break-after:page;
    width:100vw;height:100vh;aspect-ratio:auto;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="panel noprint"><div class="panel-in">
  <span class="ttl">Презентация для работодателя</span>
  <div class="who">
    <input id="nm" placeholder="Имя клиента" oninput="render()">
    <input id="co" placeholder="Компания" oninput="render()">
  </div>
  <div class="acts">
    <span class="cnt" id="cnt"></span>
    <button class="btn" onclick="dr()">Задачи ▾</button>
    <button class="btn" onclick="all(true)">Все</button>
    <button class="btn" onclick="all(false)">Снять</button>
    <button class="btn pri" onclick="window.print()">Сохранить в PDF</button>
  </div>
</div>
<div class="drawer" id="drawer"><div class="picks" id="picks"></div></div></div>

<div class="deck" id="deck"></div>

// школа в цифрах — со слайда «Школе бизнеса 38 лет» в презентации школы

const DEF_CASES=['nishchev','kuzyakov','kapyev'];
function pickCases(list){
  const ks=new Set(list.map(i=>i.k));
  const out=CASES.filter(c=>c.for.some(k=>ks.has(k)));
  for(const k of DEF_CASES){if(out.length>=3)break;if(!out.find(c=>c.k===k))out.push(CASES.find(c=>c.k===k))}
  return out;
}

      <div>
        <div class="box" style="margin-bottom:3%"><h3>Обучали управленческие команды</h3><p><b>${CLIENTS}</b></p></div>
        <div class="box dim" style="margin-bottom:3%"><h3>Партнёры</h3><p>${PARTNERS}</p></div>
        <div class="box dim"><h3>Свой кампус в Дубае</h3><p>Филиал школы в ОАЭ — там проходит выездной модуль программы</p></div>
      </div>
    </div></section>`;

  // 2..N · по слайду на задачу
  list.forEach(it=>{
    n++;
    const mods=it.mods.map(m=>`<li><span class="modn">модуль ${m[0]}</span>${MODULES[m[0]-1]}</li>`).join('');
    const who=it.who.map(w=>`<li><span class="who-t">${w[0]}</span><span class="reg">${w[1]}</span></li>`).join('');
    out+=`<section class="slide">${ft(n)}
      <div class="kick">Задача компании</div>
      <h2 style="margin-bottom:3%">${it.t}</h2>
      <div class="cols">
        <div class="box stack">
          <h3>Что изменится у вас</h3>
          ${it.ch.map(c=>{const [l,t]=c.replace('<b>','').split('</b>');
            return `<div class="st"><div class="lbl">${l.replace(/:\s*$/,'')}</div><p>${t.trim().replace(/^./,x=>x.toUpperCase())}</p></div>`}).join('')}
        </div>
        <div>
          <div class="box dim" style="margin-bottom:3%">
            <h3>Модуль</h3>
            <ul>${mods}</ul>
            <h3 style="margin-top:4%">Кто ведёт</h3>
            <ul>${who}</ul>
          </div>
          <div class="box">
            <h3>Результат на обучении MBA</h3>
            <p>${it.case}</p>
          </div>
        </div>
      </div></section>`;
  });

  // N+1 · все модули
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Программа целиком</div>
    <h2>12 модулей</h2>
    <div class="mods">${MODULES.map((m,i)=>
      `<div><span class="no">${String(i+1).padStart(2,'0')}</span>${m}</div>`).join('')}</div>
    </section>`;

  // N+2 · преподаватели
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Практики, а не теоретики</div>
    <h2 style="margin-bottom:2%">Преподаватели</h2>
    <div class="tph">${TEACHERS.filter(t=>t[2]).map(t=>
      `<div><img src="design-img/teachers/${t[2]}.jpg" alt=""><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div>
    <p class="also">Также ведут: <b>${TEACHERS.filter(t=>!t[2]).map(t=>t[0]).join(', ')}</b></p>
    </section>`;

  // общие результаты выпускников
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">50 000+ выпускников</div>
    <h2>Результаты выпускников</h2>
    <div class="res">${RESULTS.map(r=>`<div class="stat"><div class="num">${r[0]}</div><p>${r[1]}</p><small><b>${r[2].split(',')[0]}</b>,${r[2].split(',').slice(1).join(',')}</small></div>`).join('')}</div>
    </section>`;

  // кейсы — по слайду на каждый
  pickCases(list).forEach(c=>{
    n++;
    out+=`<section class="slide">${ft(n)}
      <div class="kick">Кейс выпускника</div>
      <h2 style="margin-bottom:1%">${c.n}</h2>
      <p style="color:var(--tx2);margin-bottom:3%;font-size:clamp(11.5px,1.07vw,15px)">${c.r}${c.sc?` · ${c.sc}`:''}</p>
      <div class="case">
        <div class="box stack">
          <h3>Что сделал${c.n.split(' ')[0].endsWith('а')?'а':''} на программе</h3>
          ${c.did.map((x,i)=>`<div class="st"><div class="lbl">${String(i+1).padStart(2,'0')}</div><p>${x}</p></div>`).join('')}
        </div>
        <div class="box dim" style="display:flex;flex-direction:column">
          ${c.ph?`<img class="ph" src="${c.ph}" alt="">`:''}
          <h3>Результат</h3>
          <div class="big"${c.fig.length>12?' style="font-size:clamp(26px,3.2vw,46px)"':''}>${c.fig}</div>
          <p class="bigt">${c.figt}</p>
          ${c.q?`<p class="qt">${c.q}</p>`:''}
        </div>
      </div></section>`;
  });


  // финал · что изменится в компании во время обучения
  n++;
  const names=list.map(i=>FIN[i.k]||i.t);
  const tm=[...new Set(list.flatMap(i=>i.who.map(w=>w[0]+' — '+w[1])))].slice(0,4);
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Итог</div>
    <h2>Что изменится в вашей компании<br>во время обучения сотрудника</h2>
    <div class="cols">
      <div class="box">
        <h3>Какие задачи он сможет закрыть</h3>
        <ul>${names.map(x=>`<li>${x}</li>`).join('')}</ul>
        <p style="margin-top:4%">Каждый модуль заканчивается <b>рабочим артефактом по вашей компании</b>: картой процессов, расчётом окупаемости, регламентом делегирования. Их внедряют по ходу, а не после выпуска.</p>
      </div>
      <div>
        <div class="box dim" style="margin-bottom:3%">
          <h3>Так это работает у других</h3>
          <ul>
            <li><b>Кузяков</b>, «Ванюшкины сладости»: внедрял после каждого модуля — маржинальность <span class="fig">+5–7%</span>, нейросети на контроле качества</li>
            <li><b>Нищев</b>, «Башинформсвязь»: дипломная работа по своей компании дала <span class="fig">200 млн ₽</span> экономии в год</li>
            <li><b>Волкова</b>, «Газпромбанк Автолизинг»: запустила новое направление продаж <span class="fig">ещё до диплома</span> — компания вырастила своего замдиректора</li>
          </ul>
        </div>
      </div>
    </div></section>`;

  // траектория под бизнес-задачи
  n++;
  const rows=list.map(i=>`<tr><td>${i.t}</td><td>${i.mods.map(m=>`<span class="modn">модуль ${m[0]}</span>`).join(' ')}</td><td>${i.who.map(w=>w[0]).join(', ')}</td></tr>`).join('');
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Индивидуальный план</div>
    <h2>Траектория под ваши бизнес-задачи</h2>
    <div class="cols">
      <div class="box dim" style="overflow:hidden">
        <h3>Задачи компании → модули → эксперты</h3>
        <table class="trj"><tbody>${rows}</tbody></table>
      </div>
      <div class="box stack">
        <h3>Как это устроено</h3>
        <div class="st"><div class="lbl">01 · Порядок модулей</div><p>Выстраиваем программу так, чтобы модули под ваши задачи шли первыми</p></div>
        <div class="st"><div class="lbl">02 · Выпускной проект</div><p>Тема — задача вашей компании; за сотрудником закрепляется эксперт проекта</p></div>
        <div class="st"><div class="lbl">03 · Результат остаётся у вас</div><p>Артефакты модулей внедряются по ходу обучения, а не после выпуска</p></div>
      </div>
    </div></section>`;

  // стоимость
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Стоимость</div>
    <h2>Условия участия</h2>
    <div class="cols">
      <div class="box" style="display:flex;flex-direction:column">
        <h3>Базовая стоимость обучения</h3>
        <div class="price" style="margin:4% 0 0">${rub(PRICE)}</div>
        <p class="price-note" style="margin:2% 0 auto">* при единовременной оплате</p>
        <h3>Расписание — без отрыва от работы</h3>
        <div class="week"><span class="w">ЧТ</span><span class="w">ПТ</span><span class="o">СБ</span><span class="o">ВС</span></div>
        <p class="wk-note"><b>Один модуль в месяц, четверг — воскресенье.</b> Из рабочего графика сотрудник отсутствует 2 дня в месяц (чт, пт), суббота и воскресенье — выходные дни. Всего 12 модулей за год.</p>
      </div>
      <div class="box dim" style="display:flex;flex-direction:column">
        <h3>Что включено в стоимость</h3>
        <ul class="incl">${INCLUDED.map(x=>`<li>${x}</li>`).join('')}</ul>
        <p class="price-note" style="margin-top:auto">* перелёт и проживание оплачиваются дополнительно</p>
      </div>
    </div></section>`;

  // скидка вдвоём — расчёт
  n++;
  const one=PRICE*(1-DUO_OFF);
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Стоимость</div>
    <h2>Вдвоём с коллегой — −${DUO_OFF*100}% каждому</h2>
    <div class="fmts">
      <div class="box dim"><h3>Без скидки</h3>
        <ul><li>1 участник — ${rub(PRICE)}</li><li>2 участника — ${rub(PRICE*2)}</li></ul>
        <div class="price" style="color:var(--tx3)">${rub(PRICE*2)}</div><p class="price-note" style="margin-top:4%;color:var(--tx3)">за двоих</p></div>
      <div class="box"><h3>Со скидкой ${DUO_OFF*100}%</h3>
        <ul><li>1 участник — <b>${rub(one)}</b></li><li>2 участника — <b>${rub(one*2)}</b></li></ul>
        <div class="price">${rub(one*2)}</div><p class="price-note" style="margin-top:4%">за двоих</p></div>
      <div class="box"><h3>Экономия компании</h3>
        <ul><li>${rub(PRICE-one)} на каждом участнике</li><li>Двое сотрудников внедряют изменения вместе — так их проще провести через компанию</li></ul>
        <div class="price" style="color:var(--red)">${rub((PRICE-one)*2)}</div><p class="price-note" style="margin-top:4%">выгода за двоих</p></div>
    </div></section>`;

  // форматы участия
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Стоимость</div>
    <h2>Форматы участия</h2>
    <div class="fmts">${FORMATS.map((x,i)=>`<div class="box${i?' dim':''}">
      <h3>${x[0]}</h3><ul>${x[1+1].map(y=>`<li>${y}</li>`).join('')}</ul>
      <div class="price">${rub(x[1])}</div>
      <p class="price-note" style="margin-top:4%;min-height:4.2em">${x[3]}</p></div>`).join('')}</div>
    </section>`;

  // рассрочка
  n++;
  out+=`<section class="slide">${ft(n)}
    <div class="kick">Оплата</div>
    <h2>Можно платить частями</h2>
    <div class="fmts">
      ${INSTALL.map((x,i)=>`<div class="box${i?' dim':''}"><h3>${x[0]}</h3><p>${todo(x[1])}</p></div>`).join('')}
    </div></section>`;

  n++;
  out+=cover;

  d.innerHTML=out;
}

// подхват отметок из диагностики
try{
  const pre=JSON.parse(localStorage.getItem('deckPicks')||'[]');
  pre.forEach(k=>sel.add(k));
}catch(e){}
const qs=new URLSearchParams(location.search);
if(qs.get('p'))qs.get('p').split(',').filter(Boolean).forEach(k=>sel.add(k));
if(qs.get('nm'))document.addEventListener('DOMContentLoaded',()=>document.getElementById('nm').value=qs.get('nm'));

picks();render();
if(!sel.size)document.getElementById('drawer').classList.add('open');
</script>
</body>
</html>
