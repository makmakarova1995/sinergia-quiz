<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBA Foundation для топ-менеджера</title>
<style>
@font-face{font-family:'Synergy Sans';src:url('assets/fonts/SynergySans-Light.otf') format('opentype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Synergy Sans';src:url('assets/fonts/SynergySans-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Synergy Sans';src:url('assets/fonts/SynergySans-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Synergy Sans';src:url('assets/fonts/SynergySans-SemiBold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Synergy Sans';src:url('assets/fonts/SynergySans-Bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Synergy Sans';src:url('assets/fonts/SynergySans-Black.otf') format('opentype');font-weight:900;font-style:normal;font-display:swap}
:root{--red:#ED131C;--tx:#f2f2f2;--tx2:#c8c8c8;--tx3:#858585;--card:#1C1C1C;--line:#2c2c2c;
  --serif:'Synergy Sans','Arial Narrow',Arial,sans-serif;
  --sans:'Synergy Sans',Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#111;color:var(--tx);font-weight:300;line-height:1.5}

/* ── панель сборки (не печатается) ── */
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);align-items:start}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:#161616;border-right:1px solid var(--line);z-index:99}
.panel{position:sticky;top:0;background:#161616;border-bottom:1px solid var(--line);z-index:2}
.panel-in{padding:14px 16px;display:flex;flex-direction:column;align-items:stretch;gap:9px}
.panel .ttl{font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx2);white-space:nowrap}
.who{display:flex;gap:7px}
.who input{background:#0d0d0d;border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  color:#fff;font-family:var(--sans);font-size:13px;width:100%;min-width:0;outline:none}
.who input:focus{border-color:var(--red)}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.acts .pri{flex:1}
.btn{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
  padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--red);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cnt{color:var(--tx3);font-size:12.5px;white-space:nowrap}
.cnt b{color:#fff}
.drawer{padding:0 16px 20px}
.picks{padding-top:2px}
.pick-group{margin-top:11px}
.pick-group h4{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:0 0 5px}
.pick-grid{display:grid;grid-template-columns:1fr;gap:6px}
.pick{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13px;color:var(--tx2);transition:.14s}
.pick:hover{border-color:#444}
.pick.on{border-color:var(--red);color:#fff;background:#1f1517}
.pick input{accent-color:var(--red);margin-top:2px;flex:none}
.pick small{display:block;color:#ffb020;font-size:10.5px;margin-top:2px;line-height:1.25}
.pick-task{display:block;font-size:13.5px;line-height:1.38;color:inherit;text-wrap:pretty}
.audience-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-top:2px}
.audience{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.audience .aud{min-height:40px;border:0;border-radius:6px;background:#0d0d0d;color:var(--tx2);font:500 12px var(--sans);cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.1);transition:background-color .15s,box-shadow .15s,color .15s,transform .15s}
.audience .aud:hover{box-shadow:0 0 0 1px rgba(255,255,255,.25);color:#fff}
.audience .aud:active{transform:scale(.97)}
.audience .aud.on{background:var(--red);box-shadow:none;color:#fff}

/* ── слайды ── */
.deck{margin:0 auto;padding:16px 20px 50px;min-width:0;width:100%}
.slide{container-type:inline-size;position:relative;width:1280px;height:720px;flex:none;zoom:var(--z,1);background:linear-gradient(135deg,#353535 0%,#0a0a0a 55%,#000 100%);
  border:1px solid #242424;border-radius:10px;padding:5.2% 6%;margin-bottom:18px;overflow:hidden;
  display:flex;flex-direction:column}
.slide.source-slide{padding:0;background:#000}
.source-slide img{display:block;width:100%;height:100%;object-fit:cover}
.slide .mark{position:absolute;top:4.4%;right:5%;width:30px;height:30px;border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center}
.slide .mark::before{content:'❮';color:#fff;font-size:12px}
.slide .ft{position:absolute;bottom:4%;left:6%;right:6%;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a4a4a}
.slide .ft{justify-content:flex-end}
.kick{color:var(--red);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.slide h1{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.04;
  font-size:calc(4.867cqw*var(--k,1))}
.slide h2{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.08;
  font-size:calc(3.38cqw*var(--k,1));margin-bottom:18px}
.slide h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  font-weight:600;margin-bottom:9px}
.quote{font-family:var(--serif);font-size:calc(2.704cqw*var(--k,1));line-height:1.34;color:#fff;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3.4%;flex:1;min-height:0}
.tcols{grid-template-columns:.82fr 1.18fr;gap:2.6%}
.tcols .box{padding:1.7% 2.4%}
.tcols .box.stack .st{padding:1.4% 0}
.tcols li{margin-bottom:4px}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:0 4%}
.tcols h3{margin-bottom:6px}
.box{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3.4% 3.8%}
.box.dim{border-left-color:#4a4a4a}
.box p,.box li{font-size:calc(1.447cqw*var(--k,1));color:var(--tx2);line-height:1.5}
.box b{color:#fff;font-weight:600}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:7px}
li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.box.dim li::before{background:#555}
.fig{font-family:var(--serif);color:var(--red);font-size:1.22em}
.who-t{color:#fff;font-weight:600}
.reg{display:block;color:var(--tx3);font-size:.86em}
.modn{display:inline-block;font-family:var(--serif);font-size:.82em;letter-spacing:.06em;color:#fff;
  background:var(--red);border-radius:3px;padding:1px 7px;margin-right:7px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:1.6% 3.4%;flex:1;align-content:space-between;padding-bottom:2%}
.mods div{font-size:calc(1.45cqw*var(--k,1));color:var(--tx2);padding:1.5% 0;border-bottom:1px solid #1e1e1e}
.mods .no{font-family:var(--serif);color:var(--red);margin-right:9px}
.mods div.hit{color:#fff;background:rgba(255,0,61,.08);border-left:2px solid var(--red);padding-left:8px}
.teach{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4% 3%;flex:1;align-content:start}
.teach div{font-size:calc(1.244cqw*var(--k,1));color:var(--tx3);line-height:1.38}
.teach b{display:block;color:#fff;font-weight:600;font-size:1.1em;margin-bottom:3px;
  font-family:var(--serif);text-transform:uppercase;letter-spacing:.02em}
.empty{color:var(--tx3);text-align:center;padding:70px 20px;font-size:15px}

/* обложка — как первый и последний слайд в презентации школы */
.slide.cover{padding:0;background:#000 url(design-img/fmba-cover.jpg) center/cover no-repeat}
.cover .for{position:absolute;left:4.4%;top:8%;max-width:50%;font-family:var(--serif);
  font-size:calc(2.163cqw*var(--k,1));color:#fff;line-height:1.3}
.cover .for small{display:block;font-family:var(--sans);font-size:.5em;letter-spacing:.2em;
  text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:6px}
/* стоимость и рассрочка */
.price{font-family:var(--sans);font-weight:600;color:#fff;line-height:1;letter-spacing:-.02em;
  font-size:calc(7.301cqw*var(--k,1));margin:auto 0}
.price-note{font-size:calc(1.149cqw*var(--k,1));letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600}
.incl{counter-reset:i}
.incl li{counter-increment:i;padding-left:34px;padding-bottom:2.2%;margin-bottom:2.2%;border-bottom:1px solid #262626}
.incl li::before{content:counter(i);background:none;border:1px solid #444;border-radius:999px;width:22px;height:17px;
  top:1px;font-family:var(--serif);font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}
.duo{margin-top:3%;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.duo .fig{font-size:calc(2.974cqw*var(--k,1))}
.todo{color:#ffb020;font-style:normal}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:3% 0 2.4%}
.week span{text-align:center;padding:7px 0;border-radius:4px;font-size:calc(1.217cqw*var(--k,1));font-weight:600;letter-spacing:.08em}
.week .w{background:var(--red);color:#fff}
.week .o{background:#2a2a2a;color:var(--tx2)}
.wk-note{font-size:calc(1.284cqw*var(--k,1));color:var(--tx2);line-height:1.45}
.wk-note b{color:#fff;font-weight:600}
.trj{width:100%;border-collapse:collapse;font-size:calc(1.1cqw*var(--k,1))}
.trj td{padding:2.2% 2% 2.2% 0;border-bottom:1px solid #262626;vertical-align:top;color:var(--tx2)}
.trjcols{grid-template-columns:1.9fr .75fr}
.trjcols .stack .st p{font-size:calc(1.1cqw*var(--k,1))}
.trjcols .stack .lbl{font-size:calc(1.3cqw*var(--k,1))}
.trj td:first-child{color:#fff;width:32%}
.trj td:nth-child(2){white-space:nowrap}
.trj.compact{font-size:calc(1.1cqw*var(--k,1))}
.trj.compact td{padding:1.7% 1.5% 1.7% 0}
/* пункты в столбик на всю высоту колонки */
.stack{display:flex;flex-direction:column}
.stack .st{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid #2a2a2a;padding:3% 0}
.stack h3+.st{border-top:none}
.stack .lbl{font-family:var(--serif);color:var(--red);font-size:calc(1.96cqw*var(--k,1));line-height:1.15;margin-bottom:1.5%}
.stack .st p{font-size:calc(1.622cqw*var(--k,1));color:#e6e6e6;line-height:1.42}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6%;flex:1;min-height:0}
.fmts .box{display:flex;flex-direction:column}
.fmts .price{font-size:calc(4.056cqw*var(--k,1));margin:auto 0 0}
/* преподаватели с фото */
.tph{display:grid;grid-template-columns:repeat(6,1fr);gap:2% 1.6%;flex:1;min-height:0;align-content:start}
.tph div{background:rgba(255,255,255,.03);border:1px solid #262626;border-radius:6px;padding:5%;
  font-size:calc(1.001cqw*var(--k,1));color:var(--tx3);line-height:1.32}
.tph img{width:100%;aspect-ratio:1.7;object-position:50% 20%;object-fit:cover;max-height:none;border-radius:4px;display:block;margin-bottom:6%;background:#5a5a5a}
.tph b{display:block;color:#fff;font-family:var(--serif);font-weight:500;text-transform:uppercase;
  font-size:calc(1.162cqw*var(--k,1));line-height:1.15;margin-bottom:3%}
.tph div span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.also{margin-top:1.6%;margin-bottom:2.4%;font-size:calc(1.109cqw*var(--k,1));color:var(--tx3)}
.also b{color:var(--tx2);font-weight:500}
/* цифры */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3%}
.stat{background:rgba(255,255,255,.035);border-radius:6px;padding:7% 8%}
.stat .num{white-space:nowrap;font-family:var(--serif);font-size:calc(4.867cqw*var(--k,1));line-height:1;color:#fff}
.stat .num.red{color:var(--red)}
.stat p{font-size:calc(1.284cqw*var(--k,1));color:var(--tx2);margin-top:6%;line-height:1.35}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:3.4% 2.6%;flex:1;min-height:0}
.res .stat{border-left:2px solid var(--red);display:flex;flex-direction:column}
.res .stat .num{white-space:normal;overflow-wrap:anywhere;color:var(--red);font-size:calc(3.921cqw*var(--k,1))}
.res .stat small{margin-top:auto;padding-top:4%;font-size:calc(1.082cqw*var(--k,1));color:var(--tx3)}
.res .stat small b{color:#fff;font-weight:600}
/* кейс */
.case{display:grid;grid-template-columns:1.25fr 1fr;gap:3.4%;flex:1;min-height:0}
.case .big{font-family:var(--serif);color:var(--red);font-size:calc(6.49cqw*var(--k,1));line-height:1}
.case .bigt{font-size:calc(1.555cqw*var(--k,1));color:#fff;margin-top:3%;max-width:90%}
.case .ph{width:34%;aspect-ratio:.8;object-fit:cover;border-radius:6px;float:right;margin:0 0 4% 5%}
.case .qt{font-family:var(--serif);font-size:calc(1.758cqw*var(--k,1));color:#fff;line-height:1.35;margin-top:auto}
.case-res{font-family:var(--serif);font-size:calc(2.704cqw*var(--k,1));line-height:1.15;color:var(--red);margin:0 0 3%}
.case-src{display:block;color:var(--tx3);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:2%}

/* минимальные размеры мелкого текста (холст слайда 1280×720) */
.slide .case-src,.slide .also,.slide .res .stat small{font-size:13px}
.slide .tph div{font-size:11.5px}
.slide .tph b{font-size:13px}
.slide .modn{font-size:.9em}
.slide .reg{font-size:.92em}

.fmts .box li,.fmts .box p:not(.price-note){font-size:calc(1.7cqw*var(--k,1));line-height:1.45}
.fmts .box h3{font-size:12.5px}
@media print{
  @page{size:1280px 720px;margin:0}
  body{background:#fff}
  .side,.panel,.noprint{display:none!important}
  .layout{display:block}
  .deck{max-width:none;padding:0;margin:0}
  .slide{border:none;border-radius:0;margin:0;page-break-after:always;break-after:page;
    width:1280px;height:720px;zoom:1;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:900px){.layout{display:block}.side{position:static;height:auto;max-height:50vh}}
/* крупный шрифт: смотрят с ноутбука, часть читателей 50+ */
.layout.nosb{grid-template-columns:1fr}
.layout.nosb .side{display:none}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:0 4%;align-content:stretch}
.ov .st{padding:2% 0}
.slide .kick{font-size:15px;margin-bottom:12px}
.slide h2{font-size:calc(3cqw*var(--k,1));line-height:1.1}
.slide h3{font-size:15px;margin-bottom:12px}
.slide .ft{font-size:13px}
.slide .box p,.slide .box li{font-size:calc(1.72cqw*var(--k,1));line-height:1.4}
.slide .stack .lbl{font-size:calc(2cqw*var(--k,1))}
.slide .stack .st p{font-size:calc(1.72cqw*var(--k,1))}
.slide .stat p{font-size:calc(1.5cqw*var(--k,1))}
.slide .res .stat small{font-size:15px}
.slide .mods div{font-size:calc(1.6cqw*var(--k,1))}
.slide .tph div{font-size:15px;line-height:1.3}
.slide .tph b{font-size:16px}
.slide .tph div span{-webkit-line-clamp:3}
.slide .also{font-size:15px}
.slide .wk-note{font-size:calc(1.55cqw*var(--k,1))}
.slide .price-note{font-size:15px}
.slide .incl li{font-size:calc(1.65cqw*var(--k,1))}
.jobhead{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:.8%}
.jobrows{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.jr{display:grid;grid-template-columns:10% 1fr;align-items:center;flex:1 1 auto;border-top:1px solid #2a2a2a;padding:.9% 0}
.jn{font-family:var(--serif);font-size:calc(4cqw*var(--k,1));color:var(--red);line-height:1}
.jn small{display:block;font-family:var(--sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:3px}
.js{font-size:calc(2.2cqw*var(--k,1));color:#fff;line-height:1.22;margin:0}
.jm{font-size:calc(1.45cqw*var(--k,1));color:var(--tx2);line-height:1.3;margin:.5% 0 0}
.jobout{flex:none;margin-top:1.4%;padding:1.2% 2%;background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;font-size:calc(1.7cqw*var(--k,1));color:#fff;line-height:1.35}
.jobout b{color:var(--red)}
.jobme2{flex:none;margin-top:1.2%;padding:1% 2%;background:rgba(255,255,255,.04);border-left:2px solid #555;border-radius:5px;font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.jobme2 b{color:#fff}
.cs{display:grid;grid-template-columns:.8fr 1.2fr;gap:2.6%;flex:1;min-height:0}
.cs .box{display:flex;flex-direction:column;min-height:0}
.cs .cbig{font-family:var(--serif);color:var(--red);font-size:calc(4.2cqw*var(--k,1));line-height:1.05;margin-bottom:1%}
.cs .cbigt{font-size:calc(1.75cqw*var(--k,1));color:#fff;margin:0 0 4%;line-height:1.35}
.cs ul li{font-size:calc(1.6cqw*var(--k,1));color:var(--tx2);line-height:1.38;margin-bottom:8px}
.cs .jr{grid-template-columns:13% 1fr}
.cs .jn{font-size:calc(3.2cqw*var(--k,1))}
.cs .js{font-size:calc(1.9cqw*var(--k,1))}
.cs .jm{font-size:calc(1.3cqw*var(--k,1))}
.casetodo{flex:none;margin-top:1.4%;font-size:calc(1.4cqw*var(--k,1));color:var(--tx2)}

.jsub{font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);line-height:1.35;margin:0 0 1%}
.jsub b{color:#fff;font-weight:600}

.jsub{font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.35;margin:0 0 1.2%}
.jobout{padding:1% 2%}
.jobout p{margin:0 0 .5%;font-size:calc(1.55cqw*var(--k,1));color:#fff;line-height:1.35}
.jobout p:last-child{margin-bottom:0}
.jobout b{color:var(--red)}

.jobout b{color:#ff8aa3}
.jr{padding:.55% 0}
.jn{font-size:calc(3.6cqw*var(--k,1))}
.js{font-size:calc(2.1cqw*var(--k,1))}
.jm{font-size:calc(1.5cqw*var(--k,1))}
.jobhead{margin-bottom:.4%}

.ovg{display:grid;gap:2.2%;flex:1;min-height:0;grid-auto-rows:1fr}
.ovc{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3% 3.2%;display:flex;flex-direction:column;min-height:0}
.ovn{color:#7a7a7a;margin-right:.4em}
.ovt{font-family:var(--serif);color:var(--red);font-size:calc(2.35cqw*var(--k,1));line-height:1.15;margin-bottom:4%}
.ovp{font-size:calc(1.8cqw*var(--k,1));color:#fff;line-height:1.38;margin:0}
.ovm{margin-top:auto;padding-top:4%;font-size:calc(1.5cqw*var(--k,1));color:var(--tx2);margin-bottom:0}

.ovg.sm .ovp{font-size:calc(1.5cqw*var(--k,1))}
.ovg.sm .ovm{font-size:calc(1.3cqw*var(--k,1));padding-top:2%}
.ovg.sm .ovc{padding:2.4% 2.8%}
.ovs{font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.4;margin:0 0 4%}
.jobout b{color:#fff;font-weight:600}
.fmts.inst{align-items:start;flex:none}

.fmts.inst{margin:auto 0;align-self:stretch}
.fmts.inst .box p{font-size:calc(2.3cqw*var(--k,1))}
.fmts.mid .box p,.fmts.mid .box li{font-size:calc(2cqw*var(--k,1));line-height:1.4}
.fmts.mid .box li{margin-bottom:12px}

.fmts.mid .box p,.fmts.mid .box li{font-size:calc(2.1cqw*var(--k,1))}
.fmts.mid .box li{margin-bottom:14px}
.fmts.inst{margin:0;align-self:stretch;align-items:stretch;flex:none;height:62%}

/* ── полировка по скиллу 4-make-interfaces-feel-better (чистый CSS, без анимации появления) ── */
/* #10 сглаживание шрифта */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* #11 табличные цифры там, где цены и номера модулей стоят в столбик */
.price,.stat .num,.jn,.ovn,.cnt,.rub,.fmts li,.modn,.who-t{font-variant-numeric:tabular-nums}
/* #12/#13 заголовки ровными строками, текст без «сирот» */
.slide h1,.slide h2,.ovt,.js,.cbig,.stack .lbl,.case-res{text-wrap:balance}
.slide p,.slide li,.jm,.ovp,.ovs,.jsub{text-wrap:pretty}
/* #16 вместо transition:all — только дешёвые свойства */
.btn{transition:background-color .15s,border-color .15s,color .15s,transform .15s cubic-bezier(.2,0,0,1)}
.pick{transition:background-color .15s,box-shadow .15s,color .15s,transform .15s cubic-bezier(.2,0,0,1)}
/* #14 сжатие при нажатии: 0.96, у широкой кнопки 0.98 */
.btn:active{transform:scale(.96)}
.btn.pri:active,.pick:active{transform:scale(.98)}
/* hit area ≥ 40px */
.btn{min-height:40px;display:inline-flex;align-items:center}
.who input{min-height:40px}
.pick{min-height:48px}
.pick input{width:20px;height:20px;margin-top:0}
/* #3/#4 граница тенью вместо border на тёмном фоне */
.who input,.btn:not(.pri),.pick{border:0;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.who input:focus{box-shadow:0 0 0 1px var(--red),0 0 0 4px rgba(255,0,61,.18)}
.btn:not(.pri):hover{box-shadow:0 0 0 1px var(--red)}
.btn.pri{border:0}
.pick:hover{box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.pick.on{box-shadow:0 0 0 1px var(--red)}
.slide{border:0;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tph div{border:0;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
/* #5 тонкий контур поверх фото и картинок школы */
.tph img,.case .ph,.source-slide img{outline:1px solid rgba(255,255,255,.1);outline-offset:-1px}
/* #1 концентрические радиусы: внешний = внутренний + отступ */
.tph div{border-radius:12px}
.tph img{border-radius:6px}
@media print{.slide{box-shadow:none}.tph div{box-shadow:none;border:1px solid #262626}}

/* одна задача — один слайд: воздух, крупно, мало слов */
.slide#job-o1 h2,.slide[id^=job-] h2{margin:0 0 1.4%;font-size:calc(3.1cqw*var(--k,1))}
.tl{font-size:calc(1.9cqw*var(--k,1));color:var(--tx2);margin:0 0 2.6%;line-height:1.35;max-width:88%}
.tk{display:grid;grid-template-columns:1.5fr 1fr;gap:4.5%;flex:1;min-height:0}
.tsteps{display:flex;flex-direction:column;min-height:0}
.tsh{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:1%}
.tr{display:grid;grid-template-columns:11% 1fr;align-items:center;flex:1;border-top:1px solid #2a2a2a}
.tn{font-family:var(--serif);font-size:calc(4.2cqw*var(--k,1));color:var(--red);line-height:1}
.tp{font-size:calc(2.15cqw*var(--k,1));color:#fff;line-height:1.25;margin:0}
.tm{font-size:calc(1.35cqw*var(--k,1));color:var(--tx3);margin:.6% 0 0;line-height:1.3}
.tc{background:rgba(255,255,255,.04);border-left:2px solid var(--red);border-radius:5px;padding:5% 5.5%;display:flex;flex-direction:column;min-height:0}
.tcl{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:8%}
.tcf{font-family:var(--serif);color:var(--red);font-size:calc(4.4cqw*var(--k,1));line-height:1.05;margin-bottom:4%;text-wrap:balance}
.tcp{font-size:calc(1.9cqw*var(--k,1));color:#fff;line-height:1.35;margin:0}
.tcn{margin-top:auto;padding-top:6%;font-size:calc(1.35cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.tcn b{display:block;color:#fff;font-family:var(--serif);font-weight:500;font-size:calc(1.9cqw*var(--k,1));margin-bottom:2%;text-transform:uppercase}

.tk{grid-template-columns:1.7fr 1fr;gap:5%}
.tr{padding:.5% 0}
.tp{font-size:calc(2.05cqw*var(--k,1))}
.tc{padding:6% 6%}
.tl{margin-bottom:3%}

/* продающий сценарий: сначала задача клиента, затем способ и результат */
.why-slide h2{max-width:88%;margin-bottom:2.6%}
.why-lead{max-width:84%;font-size:calc(2.15cqw*var(--k,1));line-height:1.42;color:var(--tx2);margin:0 0 5%}
.why-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:5%;margin-top:auto;margin-bottom:auto}
.why-step{border-top:2px solid var(--red);padding-top:8%}
.why-step b{display:block;font-family:var(--serif);font-size:calc(2.55cqw*var(--k,1));font-weight:500;color:#fff;line-height:1.18;margin-bottom:5%}
.why-step p{font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);line-height:1.4}
.why-num{display:block;color:var(--red);font-size:13px;letter-spacing:.16em;margin-bottom:8%}
.sell-task h2{max-width:90%;margin-bottom:4%}
.sell-grid{display:grid;grid-template-columns:1fr 1fr;gap:7%;flex:1;min-height:0}
.sell-part{border-top:1px solid #333;padding-top:4%}
.sell-label{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:5%}
.sell-part p{font-size:calc(2.25cqw*var(--k,1));line-height:1.38;color:#fff;text-wrap:pretty}
.sell-part.method p{color:var(--tx2)}
.sell-result{flex:none;border-top:2px solid var(--red);padding-top:2.2%;display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:start}
.sell-result b{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
.sell-result p{font-family:var(--serif);font-size:calc(2.2cqw*var(--k,1));line-height:1.28;color:#fff;text-wrap:balance}
.learn-slide h2{max-width:82%;margin-bottom:1.2%}
.learn-sub{font-size:calc(1.6cqw*var(--k,1));color:var(--tx2);line-height:1.4;margin:0 0 3%;max-width:84%}
.learn-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 5%;flex:1;align-content:start}
.learn-item{display:grid;grid-template-columns:72px 1fr;gap:18px;border-top:1px solid #333;padding:4.2% 0}
.learn-no{font-family:var(--serif);font-size:calc(3.2cqw*var(--k,1));line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.learn-no small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
.learn-item h3{font-family:var(--serif);font-size:calc(1.65cqw*var(--k,1));line-height:1.2;color:#fff;letter-spacing:0;text-transform:none;font-weight:500;margin:0 0 5%}
.learn-item p{font-size:calc(1.45cqw*var(--k,1));line-height:1.35;color:var(--tx2)}
.story-case h2{margin-bottom:.8%}
.case-role{font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);margin-bottom:3%}
.story-case-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:7%;flex:1;align-items:stretch}
.case-result{border-top:2px solid var(--red);padding-top:8%;display:flex;flex-direction:column}
.case-result .metric{font-family:var(--serif);font-size:calc(5.1cqw*var(--k,1));line-height:1;color:var(--red);text-wrap:balance}
.case-result p{font-size:calc(1.8cqw*var(--k,1));line-height:1.4;color:#fff;margin-top:7%}
.case-actions{border-top:1px solid #333;padding-top:6%}
.case-actions h3{margin-bottom:7%}
.case-actions li{font-size:calc(1.7cqw*var(--k,1));line-height:1.45;color:var(--tx2);margin-bottom:7%;padding-left:20px}
.school-proof{display:grid;grid-template-columns:repeat(4,1fr);gap:3%;margin:auto 0 5%}
.school-proof .stat{padding:10% 8%;border-top:2px solid var(--red);background:transparent;border-radius:0}
.school-clients{font-size:calc(1.65cqw*var(--k,1));line-height:1.45;color:var(--tx2);border-top:1px solid #303030;padding-top:2.5%}
.proofs{display:grid;gap:5%;flex:1;align-items:center}
.proof{border-top:2px solid var(--red);padding-top:7%;min-width:0}
.proof .num{font-family:var(--serif);font-size:calc(4.2cqw*var(--k,1));line-height:1;color:var(--red);text-wrap:balance}
.proof p{font-size:calc(1.7cqw*var(--k,1));line-height:1.4;color:#fff;margin-top:6%}
.proof small{display:block;font-size:14px;color:var(--tx3);margin-top:8%}
.next-slide h2{max-width:80%;margin:auto 0 2%}
.next-slide .next-copy{max-width:75%;font-size:calc(2.25cqw*var(--k,1));line-height:1.45;color:var(--tx2);margin:0 0 auto}


/* ═══ правки по итогам встречи: картинки, новая структура слайдов ═══ */
.slide .ft,.slide .mark{z-index:3}
.slide .body{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0}
.ico{width:1em;height:1em;display:block;flex:none}
/* фото: чёрно-белые, под цвет обложки */
.pic{position:absolute;overflow:hidden;background:#1a1a1a;z-index:0}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05) brightness(.92)}
.pic.r{right:0;top:0;bottom:0;width:var(--w,40%)}
.pic.r::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#060606 0%,rgba(6,6,6,.62) 24%,rgba(6,6,6,0) 62%)}
.pic.r.flat::after{display:none}
.pic.in{position:relative;border-radius:8px;min-height:0}
.pic.in::after{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}

/* 2 · о школе */
.school-slide .body{width:56%}
.school-slide h2{margin-bottom:3%}
.school-stats{display:grid;grid-template-columns:1fr 1fr;gap:5% 7%;margin:auto 0 4%}
.school-stats .stat{padding:5% 0 0;background:transparent;border-radius:0;border-top:2px solid var(--red)}
.school-stats .stat p{margin-top:4%}

/* 3 · концепция программы */
.concept-slide h2{margin-bottom:3%}
.concept-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:5%;flex:1;min-height:0}
.concept-nums{display:grid;grid-template-columns:1fr 1fr;gap:7% 6%;align-content:center}
.cn{border-top:2px solid var(--red);padding-top:6%}
.cn .ico{font-size:calc(2.8cqw*var(--k,1));color:var(--red);margin-bottom:8%}
.cn b{display:block;font-family:var(--serif);font-weight:500;font-size:calc(5.4cqw*var(--k,1));line-height:1;color:#fff;white-space:nowrap}
.cn b small{font-size:.36em;margin-left:.3em;letter-spacing:0}
.cn span{display:block;font-size:calc(1.6cqw*var(--k,1));color:var(--tx2);margin-top:5%;line-height:1.35}
.concept-strip{flex:none;margin-top:3.2%;padding:1.5% 2.2%;background:rgba(255,255,255,.04);border-left:2px solid var(--red);border-radius:5px;font-size:calc(1.85cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.concept-strip b{color:#fff;font-weight:600}

/* 4 · преподаватели */
.tph.v2{display:grid;grid-template-columns:repeat(6,1fr);gap:0 1.8%;flex:none;align-content:start;margin-top:1%}
.slide .tph.v2 div{padding:0;background:none;box-shadow:none;border-radius:0;font-size:calc(1.25cqw*var(--k,1));color:var(--tx2);line-height:1.3}
.tph.v2 img{aspect-ratio:.8;height:auto;border-radius:6px;margin-bottom:7%;object-position:50% 18%;filter:grayscale(1) contrast(1.05)}
.slide .tph.v2 b{font-size:calc(1.3cqw*var(--k,1));margin-bottom:3%}
.slide .tph.v2 div span{-webkit-line-clamp:4}
.t-cap{margin-top:auto;padding-top:1.8%;border-top:1px solid #303030;font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.4}
.t-cap b{color:#fff;font-weight:600}

/* 6 · выбор задач */
.pick-slide h2{margin-bottom:.8%}
.pick-ask{font-size:calc(1.9cqw*var(--k,1));color:var(--tx2);margin:0 0 2.6%}
.pick-grid2{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:3% 2.4%;flex:1;min-height:0}
.pcard{position:relative;background:rgba(255,255,255,.035);border-top:2px solid #3a3a3a;border-radius:5px;padding:5.5% 6%;display:flex;flex-direction:column;min-height:0}
.pcard.on{border-top-color:var(--red);background:rgba(255,0,61,.08)}
.pcard .ico{font-size:calc(3.2cqw*var(--k,1));color:var(--red)}
.pcard .pn{position:absolute;top:6%;right:6%;font-family:var(--serif);font-size:calc(1.8cqw*var(--k,1));color:var(--tx3)}
.slide .pcard h3{margin:auto 0 0;font-family:var(--serif);font-weight:500;font-size:calc(2cqw*var(--k,1));line-height:1.2;color:#fff;letter-spacing:0;text-transform:none;text-wrap:balance}
.pick-foot{flex:none;margin-top:2.4%;padding:1.3% 2.2%;background:rgba(255,255,255,.04);border-left:2px solid var(--red);border-radius:5px;font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.pick-foot b{color:#fff;font-weight:600}

/* 7а · слайд задачи: текст слева, фото справа */
.sell2 .body{width:56%}
.slide.sell2[id^=job-] h2{font-size:calc(2.7cqw*var(--k,1));margin:0 0 3.4%;max-width:100%}
.sell2 .sell-grid{grid-template-columns:1fr;gap:0;flex:1}
.sell2 .sell-part{border-top:1px solid #333;padding:2.6% 0 2.2%}
.sell2 .sell-label{margin-bottom:2.4%}
.sell2 .sell-part p{font-size:calc(1.95cqw*var(--k,1));line-height:1.36}
.sell2 .sell-result{grid-template-columns:1fr;gap:8px;padding-top:2%}
.sell2 .sell-result p{font-size:calc(1.9cqw*var(--k,1))}

/* 7б · слайд модулей */
.learn2 .body{width:68%}
.learn2 h2{max-width:100%}
.learn2 .learn-sub{max-width:100%;margin-bottom:2%}
.learn-list{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:84px 1fr;gap:20px;border-top:1px solid #333;padding:2.4% 0;align-items:start}
.mrow h3{font-family:var(--serif);font-size:calc(1.9cqw*var(--k,1));line-height:1.2;color:#fff;letter-spacing:0;text-transform:none;font-weight:500;margin:0 0 1.2%}
.mrow p{font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.mrow .tag{display:inline-block;margin-left:10px;padding:1px 8px;border-radius:999px;font-family:var(--sans);font-size:13px;letter-spacing:.04em;color:#fff;background:var(--red);vertical-align:middle;text-transform:none}

/* 7в · кейс */
.case2 .body{width:62%}
.case2 .story-case-grid{grid-template-columns:.9fr 1.1fr}
.mono{width:15cqw;height:15cqw;border-radius:50%;box-shadow:inset 0 0 0 2px var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:5.2cqw;color:#fff;position:relative;z-index:1;margin:auto 12% auto auto}
.pic.r.mono-panel{background:#0e0e0e;display:flex}

/* 8 · возражение: курс в записи */
.obj-rows{display:flex;flex-direction:column;flex:1;min-height:0}
.orow{display:grid;grid-template-columns:8% 33% 1fr;gap:2%;align-items:center;flex:1;border-top:1px solid #333}
.or-n{font-family:var(--serif);font-size:calc(3.4cqw*var(--k,1));color:var(--red);line-height:1}
.orow b{font-family:var(--serif);font-weight:500;font-size:calc(2.1cqw*var(--k,1));color:#fff;line-height:1.2;text-wrap:balance}
.orow p{font-size:calc(1.65cqw*var(--k,1));color:var(--tx2);line-height:1.4}

/* 9 · индивидуальная часть и «что получит компания» */
.indiv .body{width:64%}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:3%;flex:1;min-height:0;align-content:center}
.fcards.g2{grid-template-columns:1fr 1fr;grid-auto-rows:1fr;align-content:stretch;gap:4% 4%}
.fc{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:7% 6%;display:flex;flex-direction:column}
.fcards.g2 .fc{padding:6% 7%}
.fc .ico{font-size:calc(3.4cqw*var(--k,1));color:var(--red);margin-bottom:auto}
.fc b{display:block;font-family:var(--serif);font-weight:500;font-size:calc(2.3cqw*var(--k,1));color:#fff;line-height:1.18;margin:8% 0 3%}
.fc p{font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.4}

/* 10 · календарь модулей и платежи */
.cal{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:2.4% 1.4%;flex:1;min-height:0}
.mc{background:rgba(255,255,255,.035);border-top:2px solid #3a3a3a;border-radius:5px;padding:6% 6% 5%;display:flex;flex-direction:column;min-height:0}
.mc.dxb{border-top-color:var(--red);background:rgba(255,0,61,.09)}
.mc .mm{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.mc .mn{font-family:var(--serif);font-size:calc(3cqw*var(--k,1));color:var(--red);line-height:1;margin:5% 0 4%}
.mc .mt{font-size:calc(1.18cqw*var(--k,1));color:#fff;line-height:1.28}
.mc .pay{margin-top:auto;align-self:flex-start;font-size:13px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:var(--red);color:#fff}
.mc .pay.o{background:transparent;box-shadow:inset 0 0 0 1px var(--red)}
.mc .tag{font-size:13px;color:var(--red);font-weight:600;margin-top:3%}
.cal-leg{flex:none;margin-top:2.4%;display:flex;flex-wrap:wrap;gap:6px 26px;font-size:calc(1.35cqw*var(--k,1));color:var(--tx2);line-height:1.4}
.cal-leg b{color:#fff;font-weight:600}

/* 11 · форматы + что включено */
.fm-slide .fmts{flex:none;height:auto}
.fm-slide .fmts .box{min-height:0}
.fm-slide .fmts .price{font-size:calc(3.6cqw*var(--k,1));margin:auto 0 0;padding-top:4%}
.fm-slide .fmts .price-note{margin-top:3%!important;min-height:0!important;line-height:1.3!important;font-size:calc(1.1cqw*var(--k,1));letter-spacing:.05em}
.fm-slide .fmts .box li,.fm-slide .fmts .box p:not(.price-note){font-size:calc(1.5cqw*var(--k,1))}
.fm-incl{margin-top:2.6%;border-top:1px solid #333;padding-top:1.6%}
.fm-incl h3{margin-bottom:1.2%}
.fm-incl ul{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 3%}
.fm-incl li{font-size:calc(1.35cqw*var(--k,1));color:var(--tx2);line-height:1.35;margin-bottom:1.4%}
.fm-note{margin-top:.6%;font-size:calc(1.15cqw*var(--k,1));letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-weight:600}
.fm-slide .price-note.hy{color:var(--tx3)}

/* 12 · рассрочка */
.inst-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:3%;flex:1;min-height:0}
.tl-card{display:flex;flex-direction:column;justify-content:center}

.tr2{margin-bottom:9%}
.tr2-l{font-family:var(--serif);font-size:calc(2.3cqw*var(--k,1));color:#fff;margin-bottom:4%}
.tmln{display:grid;grid-template-columns:repeat(12,1fr);border-top:2px solid #333;margin-top:5%}
.tmc{position:relative;padding-top:20px;text-align:center;font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums}
.tmc.on{color:#fff;font-weight:600}
.tmd{position:absolute;top:-13px;left:50%;margin-left:-12px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,0,61,.22)}
.tl-card .tl-note{font-size:calc(1.5cqw*var(--k,1))!important;margin:0}
.inst-side{display:flex;flex-direction:column;gap:5%}
.inst-side .box{flex:1;display:flex;flex-direction:column;justify-content:center}

/* 13 · вдвоём с коллегой */
.duo-wrap{display:grid;grid-template-columns:1.45fr 1fr;gap:4%;flex:1;align-items:center;min-height:0}
.duo-old{font-size:calc(4.2cqw*var(--k,1));font-weight:600;letter-spacing:-.02em;color:#555;line-height:1}
.duo-lab{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#555;margin:1.4% 0 6%}
.duo-new{font-size:calc(7.6cqw*var(--k,1));font-weight:600;letter-spacing:-.02em;color:#fff;line-height:1;white-space:nowrap}
.duo-cap{font-size:calc(1.75cqw*var(--k,1));color:var(--red);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:3%}
.duo-ico{font-size:calc(17cqw*var(--k,1));color:var(--red);justify-self:center;opacity:.92}
.duo-ico .ico{stroke-width:.9}
.duo-tax{flex:none;font-size:calc(1.6cqw*var(--k,1));color:var(--tx2);border-top:1px solid #303030;padding-top:2%}

/* 15 · следующий шаг: фото справа */
.next-slide .body-n{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;width:56%}

/* ── вторая итерация: пустоты и размеры ── */
.tph.v2 img{aspect-ratio:.7}

.case2 .story-case-grid{align-items:center;gap:6%;grid-template-columns:.95fr 1.05fr}
.case2 .case-result{padding-top:6%}
.case2 .case-result .metric{font-size:calc(6.2cqw*var(--k,1))}
.case2 .case-result p{font-size:calc(2.1cqw*var(--k,1))}
.case2 .case-actions li{font-size:calc(1.95cqw*var(--k,1))}
.fcards,.fcards.g2{align-content:stretch;grid-auto-rows:1fr}
.fcards:not(.g2){max-height:66%}
.mc .mt{font-size:calc(1.32cqw*var(--k,1))}


/* ── третья итерация: рассрочка одним графиком, скидка на одного участника ── */
.tmc small{display:block;font-size:13px;color:var(--red);font-weight:600;margin-top:4px;white-space:nowrap}
.duo-disc{font-size:calc(2.6cqw*var(--k,1));font-weight:600;color:var(--red);margin:0 0 3.4%;letter-spacing:-.01em}
.duo-slide .body{width:61%}
.duo-slide .duo-wrap{display:block;flex:1;padding-top:5%}
.duo-slide .duo-photo img{object-position:50% 44%}

/* ── порядок как у Сколково: «это про вас», портрет, формат обучения, выпускники ── */
.pcard .ico{font-size:calc(2.5cqw*var(--k,1))}
.slide .pcard h3{font-size:calc(1.75cqw*var(--k,1))}
.pcard .pt{margin-top:4%;font-size:calc(1.15cqw*var(--k,1));color:var(--tx3);line-height:1.3}
.pcard .pt b{color:var(--red);font-weight:600;margin-right:4px}

/* портрет участников */
.portrait-slide .body{width:68%}
.pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:3.2% 3%;margin:1% 0 0}
.ptc{background:rgba(255,255,255,.035);border-top:2px solid var(--red);border-radius:5px;padding:5% 6%;display:flex;flex-direction:column;min-height:0}
.ptc .ico{font-size:calc(2.4cqw*var(--k,1));color:var(--red);margin-bottom:6%}
.ptc b{font-family:var(--serif);font-weight:500;font-size:calc(4.2cqw*var(--k,1));line-height:1;color:#fff}
.ptc b small{font-size:.38em;margin-left:.3em;letter-spacing:0}
.ptc>span{font-size:calc(1.5cqw*var(--k,1));color:var(--tx2);margin-top:4%}
.ptc .lbl{color:#fff;font-size:calc(1.6cqw*var(--k,1));margin:0 0 4%}
.pbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#2a2a2a}
.pbar i{background:var(--red);display:block;height:100%}
.pleg{display:flex;justify-content:space-between;gap:10px;margin-top:4%;font-size:calc(1.3cqw*var(--k,1));color:var(--tx2);line-height:1.3}
.pleg span{margin:0}
.pt-co{margin-top:3%;border-top:1px solid #333;padding-top:2%}
.pt-co .lbl{display:block;font-size:calc(1.4cqw*var(--k,1));letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:1.4%}
.pt-co p{font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.4}

/* формат обучения */
.fmt-slide h2{margin-bottom:2.4%}
.fmt-grid{display:grid;grid-template-columns:1fr .74fr 1fr;column-gap:26px;flex:1;min-height:0}
.fmt-col{display:flex;flex-direction:column;gap:3%;min-height:0}
.fmt-card{flex:1;position:relative;background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3.4% 4%;min-height:0;display:flex;flex-direction:column;justify-content:center}
.fmt-card b{font-family:var(--serif);font-weight:500;font-size:calc(1.5cqw*var(--k,1));color:#fff;line-height:1.18;margin-bottom:2%}
.fmt-card p{font-size:calc(1.18cqw*var(--k,1));color:var(--tx2);line-height:1.38}
.fmt-col.l .fmt-card::after,.fmt-col.r .fmt-card::before{content:'';position:absolute;top:50%;width:26px;height:2px;background:var(--red)}
.fmt-col.l .fmt-card::after{left:100%}
.fmt-col.r .fmt-card::before{right:100%}
.fmt-mid{background:var(--red);border-radius:5px;display:flex;align-items:center;justify-content:center;padding:6%;text-align:center}
.fmt-mid b{font-family:var(--serif);font-weight:500;text-transform:uppercase;font-size:calc(2.3cqw*var(--k,1));line-height:1.12;color:#fff}

/* кто у нас учился */
.alum-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:3% 2.4%;flex:1;min-height:0}
.alum{background:rgba(255,255,255,.035);border-top:2px solid #3a3a3a;border-radius:5px;padding:6%;display:flex;flex-direction:column;min-height:0}
.alum .am{width:4.4cqw;height:4.4cqw;border-radius:50%;box-shadow:inset 0 0 0 2px var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.7cqw;color:#fff;margin-bottom:auto;flex:none}
.alum b{font-family:var(--serif);font-weight:500;font-size:calc(1.9cqw*var(--k,1));color:#fff;line-height:1.15;margin:6% 0 3%}
.alum .r{font-size:calc(1.3cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.alum.big{border-top-color:var(--red);background:rgba(255,0,61,.08);justify-content:center}
.alum.big b{font-size:calc(4.4cqw*var(--k,1));color:var(--red);margin:0 0 3%}

/* ── правка 3 ── */
.pbar{flex:none}
.fmt-card b{font-size:calc(1.7cqw*var(--k,1))}
.fmt-card p{font-size:calc(1.32cqw*var(--k,1))}
.alum b{font-size:calc(2.1cqw*var(--k,1))}
.alum .r{font-size:calc(1.45cqw*var(--k,1))}
.pcard .pt{font-size:calc(1.25cqw*var(--k,1))}

/* ── правка 4 ── */
.slide .pcard h3{font-size:calc(2.35cqw*var(--k,1));line-height:1.2}
.pcard .ico{font-size:calc(2.8cqw*var(--k,1))}

/* ── правка 5: обложка с названием ── */
.slide.cover.c2{background:linear-gradient(135deg,#353535 0%,#0a0a0a 55%,#000 100%)}
.cover.c2 .cv-logo{position:absolute;right:5.5%;top:6.2%;width:20.5%;height:auto}
.cover.c2 .cv-photo{position:absolute;left:63%;top:29.9%;width:35.8%;aspect-ratio:1;border-radius:50%;background:url(design-img/cover-photo.jpg) center/cover;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.cover.c2 .cv-text{position:absolute;left:5.6%;top:52%;transform:translateY(-50%);max-width:54%}
.cover.c2 h1{font-family:var(--sans);font-size:calc(5.65cqw);font-weight:700;line-height:.92;letter-spacing:-.035em;text-transform:none;text-wrap:balance}
.cover.c2 h1 span{display:block;color:var(--red)}
.cover.c2 .cv-description{max-width:92%;margin-top:28px;font-size:calc(2.35cqw);font-weight:500;line-height:1.16;color:#fff;text-wrap:balance}
.cover.c2 .cv-school{margin-top:22px;font-size:calc(1.55cqw);font-weight:400;line-height:1.25;color:var(--tx2)}

/* ── слайд «Если вы каждый день сталкиваетесь с задачами»: фото в круге по центру, задачи вокруг ── */
.pick-hub .hub-ph{position:absolute;left:470px;top:275px;width:340px;height:340px;border-radius:50%;box-shadow:0 0 0 2px var(--red),0 0 0 16px rgba(255,255,255,.05)}
.pick-hub .hub-ph::after{border-radius:50%}
.pick-hub .hub-ph img{object-position:85% 50%}
.hub-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hub-lines line{stroke:rgba(255,0,61,.6);stroke-width:1.5}
.hub-lines circle{fill:var(--red)}
.hub-n{position:absolute;display:flex;align-items:center;gap:18px;width:358px;transform:translateY(-50%);z-index:2}
.hub-n.l{left:70px;flex-direction:row-reverse;text-align:right}
.hub-n.r{left:852px}
.hub-b{flex:none;width:66px;height:66px;border-radius:50%;border:2px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.hub-b .ico{font-size:30px}
.hub-b.on{background:var(--red);color:#fff}
.hub-t{font-size:calc(1.85cqw*var(--k,1));font-weight:600;line-height:1.22;color:#fff;text-wrap:balance}

/* 4 · зачем MBA, общий слайд */
.why2 .body{width:60%}
.why2 h2{max-width:100%;margin-bottom:3%}
.why2 .why-lead{max-width:100%;margin:0 0 3%;font-size:calc(1.9cqw*var(--k,1))}
.why-rows{display:flex;flex-direction:column;margin-top:auto}
.why-row{display:grid;grid-template-columns:11% 1fr;gap:2%;border-top:1px solid #333;padding:2.2% 0}
.why-row .why-num{margin:0;padding-top:4px}
.why-row b{display:block;font-family:var(--serif);font-size:calc(2.2cqw*var(--k,1));font-weight:500;color:#fff;line-height:1.18;margin-bottom:1.5%}
.why-row p{font-size:calc(1.5cqw*var(--k,1));color:var(--tx2);line-height:1.4}
.why2 .pic img{object-position:50% 50%}
.blk-slide .why-num{font-size:14px;letter-spacing:.06em}

/* ── зона правок по задачам: каждая задача пишет CSS только между своими метками ── */
/* @@cal-begin */
/* 20 · график модулей и платежей: месяцы строками, внутри даты, модуль и преподаватель */
.cal-slide .cl{display:flex;flex-direction:column;gap:5px;flex:none}
.cal-slide .cl-m{display:grid;grid-template-columns:10.5% 1fr;flex:none;background:rgba(255,255,255,.035);border-top:2px solid #3a3a3a;border-radius:4px}
.cal-slide .cl-m.dxb{border-top-color:var(--red);background:rgba(255,0,61,.09)}
.cal-slide .cl-rail{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px 10px;min-width:0}
.cal-slide .cl-mo{font-size:calc(1.3cqw*var(--k,1));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;line-height:1.15}
.cal-slide .cl-sub{font-size:13px;color:var(--tx3);letter-spacing:.02em;line-height:1.2;white-space:nowrap}
.cal-slide .cl-pay,.cal-slide .cl-tag{font-size:13px;font-weight:600;letter-spacing:.03em;padding:2px 9px;border-radius:999px;background:var(--red);color:#fff;white-space:nowrap;line-height:1.3}
.cal-slide .cl-pay{align-self:flex-start;margin-top:2px}
.cal-slide .cl-tag{display:inline-block;margin-left:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--red);color:var(--red);vertical-align:middle}
.cal-slide .cl-rows{display:flex;flex-direction:column;min-width:0}
.cal-slide .cl-r{display:grid;grid-template-columns:14.2% 1fr 13.5%;gap:0 14px;align-items:center;padding:4px 12px 4px 0;min-height:34px}
.cal-slide .cl-r+.cl-r{border-top:1px solid #2c2c2c}
.cal-slide .cl-d{font-family:var(--serif);font-size:calc(1.85cqw*var(--k,1));font-weight:500;color:var(--red);line-height:1.1;white-space:nowrap}
.cal-slide .cl-d.tbc{font-size:calc(1.4cqw*var(--k,1));font-weight:400;color:var(--tx2);white-space:normal;line-height:1.15}
.cal-slide .cl-t{font-size:calc(1.5625cqw*var(--k,1));color:#fff;line-height:1.2}
.cal-slide .cl-p{font-size:calc(1.2cqw*var(--k,1));color:var(--tx2);line-height:1.25}
.cal-slide .cl-s2{background:transparent;border-top:2px dashed #3a3a3a}
.cal-slide .cl-s2 .cl-r{grid-template-columns:1fr auto}
.cal-slide .cl-s2 .cl-t{color:var(--tx2)}
.cal-slide .cl-pays{display:flex;gap:8px}
.cal-slide .cal-leg{margin-top:10px;gap:4px 28px;font-size:calc(1.22cqw*var(--k,1))}

/* @@portrait-begin */
/* 6 · портрет участников: цифры, отрасли чипами, сильные описания компаний */
.pq-head{display:flex;justify-content:space-between;align-items:flex-start;gap:3%}
.pq-head h2{margin-bottom:0}
.pq-facts{display:flex;gap:2.2cqw;flex:none}
.pq-fact{width:15.4cqw;border-top:2px solid var(--red);padding-top:.9cqw}
.pq-fact b{display:block;font-family:var(--serif);font-weight:500;font-size:calc(4.6cqw*var(--k,1));line-height:1;color:#fff}
.pq-fact:first-child b{color:var(--red)}
.pq-fact span{display:block;margin-top:.8cqw;font-size:calc(1.4cqw*var(--k,1));line-height:1.25;color:var(--tx2)}
.pq-lbl{font-size:calc(1.25cqw*var(--k,1));letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:2.1cqw 0 1cqw}
.pq-secs{display:flex;flex-direction:column;gap:.8cqw}
.pq-row{display:flex;gap:.8cqw}
.pq-sec{flex:auto;display:flex;align-items:center;gap:.8cqw;padding:.6cqw 1.2cqw;background:rgba(255,255,255,.05);border-radius:5px;font-size:calc(1.5cqw*var(--k,1));line-height:1.2;color:#fff}
.pq-sec b{font-family:var(--serif);font-weight:500;font-size:1.35em;color:var(--red)}
.pq-cos{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1cqw 1.4cqw;flex:1;min-height:0}
.pq-co{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:.9cqw 1.5cqw;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pq-co b{font-family:var(--serif);font-weight:500;font-size:calc(1.75cqw*var(--k,1));line-height:1.18;color:#fff}
.pq-co span{margin-top:.5cqw;font-size:calc(1.45cqw*var(--k,1));line-height:1.3;color:var(--tx2)}

/* @@teachers-begin */
/* преподаватели: один слайд с горизонтальной лентой карточек */
.tch-slide{padding-bottom:6.4%}
.tch-head{display:flex;justify-content:space-between;align-items:flex-end;gap:3%}
.slide .tch-head h2{margin-bottom:0}
.tch-navs{display:flex;gap:12px;flex:none}
.tch-nav{width:52px;height:52px;border:0;border-radius:50%;background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.25);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color .15s,box-shadow .15s,opacity .15s,transform .15s}
.tch-nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tch-nav:hover:not(:disabled){background:var(--red);box-shadow:none}
.tch-nav:active:not(:disabled){transform:scale(.94)}
.tch-nav:disabled{opacity:.28;cursor:default}
.tch-lead{font-size:calc(1.6cqw*var(--k,1));line-height:1.35;color:var(--tx2);margin:1.4% 0 2.2%;display:flex;flex-wrap:wrap;align-items:center;gap:.5em 1.1em}
.tch-wrap{position:relative;flex:1;min-height:0}
.tch-track{display:flex;gap:1.5cqw;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;outline:none}
.tch-track::-webkit-scrollbar{display:none}
.tch-wrap:not(.at-end) .tch-track{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tch-card{flex:0 0 22cqw;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column}
.tch-ph{position:relative;flex:none;aspect-ratio:1/1.1;border-radius:8px;overflow:hidden;background:#5a5a5a;margin-bottom:5%}
.tch-ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:grayscale(1) contrast(1.05);outline:1px solid rgba(255,255,255,.1);outline-offset:-1px;border-radius:8px}
.tch-card.gs{margin-left:1.5cqw}
.tch-ph i,.tch-lg{font-style:normal;font-size:14px;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.78);padding:7px 11px;border-left:2px solid #7a7a7a}
.tch-ph i{position:absolute;left:0;bottom:0}
.tch-lg:not(:first-child){margin-left:1.2em}
.tch-card.p .tch-ph i,.tch-lg.p{background:var(--red);border-left-color:#fff}
.tch-card b{display:block;font-family:var(--serif);font-weight:500;text-transform:uppercase;font-size:calc(1.7cqw*var(--k,1));line-height:1.12;color:#fff;margin-bottom:3%}
.tch-r{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:calc(1.4cqw*var(--k,1));line-height:1.3;color:var(--tx2)}
@media print{
  .tch-wrap{flex:none}
  .tch-track{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw 2cqw;height:auto;overflow:visible;scroll-snap-type:none;-webkit-mask-image:none!important;mask-image:none!important}
  .tch-card{flex:none;flex-direction:row;align-items:flex-start;gap:1.4cqw}
  .tch-card:not(.pr){display:none}
  .tch-card.gs{margin-left:0}
  .tch-ph{width:42%;aspect-ratio:1/1.12;margin-bottom:0}
  .tch-tx{flex:1;min-width:0}
  .tch-card b{font-size:calc(1.6cqw*var(--k,1))}

/* 3 · подсветка задач на круге, итог: активная задача белая и чуть крупнее, иконка — красный круг с мягким свечением
   и одной спокойной волной при включении; линия к фото и точка на круге ярче. Неактивные — серые, но читаемые.
   Двигаются только transform/цвет/тень (без сдвига соседей), переходы 0.6 с; бесконечной пульсации нет */
.pick-hub{--hub-t:.6s cubic-bezier(.33,0,.2,1)}
.pick-hub .hub-b{position:relative}
.pick-hub.live .hub-t{color:rgba(255,255,255,.55);transform:none;transition:color var(--hub-t),transform var(--hub-t)}
.pick-hub.live .hub-n.l .hub-t{transform-origin:calc(100% + 51px) 50%}
.pick-hub.live .hub-n.r .hub-t{transform-origin:-51px 50%}
.pick-hub.live .hub-t.on{color:#fff;transform:scale(1.08)}
.pick-hub.live .hub-b{opacity:.6;transform:none;animation:none;box-shadow:0 0 0 0 rgba(237,19,28,0),0 0 0 0 rgba(237,19,28,0);transition:background-color var(--hub-t),color var(--hub-t),box-shadow var(--hub-t),opacity var(--hub-t),transform var(--hub-t)}
.pick-hub.live .hub-b.on{opacity:1;transform:scale(1.14);animation:none;box-shadow:0 0 0 7px rgba(237,19,28,.16),0 0 32px 6px rgba(237,19,28,.42)}
.pick-hub.live .hub-b::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--red);opacity:0;pointer-events:none}
.pick-hub.live .hub-b.on::after{animation:hubWave 1.8s cubic-bezier(.2,.6,.35,1) .2s 1 both}
@keyframes hubWave{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.pick-hub.live .hub-lines line{stroke:rgba(255,0,61,.3);stroke-width:1.5;filter:drop-shadow(0 0 0 rgba(237,19,28,0));transition:stroke var(--hub-t),stroke-width var(--hub-t),filter var(--hub-t)}
.pick-hub.live .hub-lines line.on{stroke:var(--red);stroke-width:3;filter:drop-shadow(0 0 5px rgba(237,19,28,.85))}
.pick-hub.live .hub-lines circle{opacity:.5;r:4.5px;transition:opacity var(--hub-t),r var(--hub-t)}
.pick-hub.live .hub-lines circle.on{opacity:1;r:7px}
/* в PDF и при «меньше движения»: все задачи одинаковые, без свечения, волны и масштаба */
@media print,(prefers-reduced-motion:reduce){

  .pick-hub .hub-b,.pick-hub .hub-b.on{opacity:1!important;transform:none!important;animation:none!important;box-shadow:none!important;transition:none!important}
  .pick-hub .hub-b::after{content:none!important;animation:none!important}
  .pick-hub .hub-lines line,.pick-hub .hub-lines line.on{stroke:rgba(255,0,61,.6)!important;stroke-width:1.5!important;filter:none!important;transition:none!important}
  .pick-hub .hub-lines circle,.pick-hub .hub-lines circle.on{opacity:1!important;r:4.5px!important;transition:none!important}
}

(()=>{
  const card=n=>{const m=MODINFO[n];return `<button type="button" class="mp-x" aria-label="Закрыть">×</button><div class="mp-k">Модуль ${String(n).padStart(2,'0')}</div><h3>${MODSHORT[n-1]}</h3><ul>${m.t.map(x=>`<li>${x}</li>`).join('')}</ul><p class="mp-who">Ведут: ${m.w}</p>`};
  const close=sl=>{sl.classList.remove('mod-open');sl.querySelectorAll('[data-m].on').forEach(e=>e.classList.remove('on'))};
  document.addEventListener('click',e=>{
    // клик в любом месте, кроме кнопки модуля, закрывает открытую карточку
    const t=e.target.closest&&e.target.closest('[data-m]'),sl=t&&t.closest('.blk-slide');
    if(!sl){document.querySelectorAll('.blk-slide.mod-open').forEach(close);return}
    const n=+t.dataset.m,pop=sl.querySelector('.mod-pop');
    if(sl.classList.contains('mod-open')&&+pop.dataset.m===n){close(sl);return}
    close(sl);pop.dataset.m=n;pop.innerHTML=card(n);sl.classList.add('mod-open');
    sl.querySelectorAll(`[data-m="${n}"]`).forEach(x=>x.classList.add('on'));
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.blk-slide.mod-open').forEach(close)});
})();
// 3 · автоподсветка задач на слайде 3: по очереди, каждые 4 с (STEP), пока слайд виден на экране; вид подсветки — CSS @@k4hub; render() не трогает, сама следит за #deck
(()=>{
  const STEP=4000,deck=document.getElementById('deck'),still=matchMedia('(prefers-reduced-motion: reduce)');
  let slide=null,io=null,timer=0,seen=false,printing=false;
  const paint=i=>slide.querySelectorAll('[data-h]').forEach(e=>e.classList.toggle('on',+e.dataset.h===i));
  const stop=()=>{clearInterval(timer);timer=0;if(slide){slide.classList.remove('live');paint(-1)}};
  const sync=()=>{
    stop();
    if(!slide||!seen||printing||document.hidden||still.matches)return;
    const n=slide.querySelectorAll('.hub-b').length;let i=0;
    slide.classList.add('live');paint(0);
    if(n>1)timer=setInterval(()=>paint(i=(i+1)%n),STEP);
  };
  const bind=()=>{
    if(io)io.disconnect();
    stop();seen=false;slide=deck.querySelector('.pick-hub');
    if(!slide)return;
    io=new IntersectionObserver(es=>{
      const e=es[es.length-1],v=e.isIntersecting&&(e.intersectionRatio>=.5||e.intersectionRect.height>=innerHeight*.6);
      if(v!==seen){seen=v;sync()}
    },{threshold:Array.from({length:21},(_,i)=>i/20)});
    io.observe(slide);
  };
  new MutationObserver(bind).observe(deck,{childList:true});
  document.addEventListener('visibilitychange',sync);
  still.addEventListener('change',sync);
  window.addEventListener('beforeprint',()=>{printing=true;sync()});
  window.addEventListener('afterprint',()=>{printing=false;sync()});
})();

  // 10 · преподаватели: один слайд, сначала практики, потом лекторы; на сайте сетка листается вниз, в PDF первые 3 карточки
  S('tch-slide',tchSlide());

  // 11 · кто у нас учился: фото, компания и одна строка о ней (поля phs, cn, co в CASES)
  const ALUMNI=['nishchev','kuzyakov','kapyev','isaev','volkova','yuditskaya','remenyako'].map(k=>byCase.get(k)).filter(Boolean);
  S('alum-slide',`<div class="kick">Кто у нас учился</div><h2>Выпускники программы</h2>
    <div class="alum-grid">${ALUMNI.map(c=>`<div class="alum"><div class="am">${c.phs?`<img src="${c.phs}" alt="${c.n}">`:initials(c.n)}</div><b>${c.n}</b><span class="al-cn">${c.cn||c.r}</span></div>`).join('')}<div class="alum big"><b>${SCHOOL[0][0]}</b><span class="r">выпускников школы</span></div></div>`);

  // 12 · почему MBA актуален в 2027 году: свои формулировки для топ-менеджеров и собственников
  const OBJ=TOP?[
      ['Актуальная программа','Обновляется каждый поток с учётом реалий рынка.'],
      ['Преподают практики','Собственники и руководители действующего бизнеса: разбираете то, что работает сейчас.'],
      ['Работаете над задачей своей компании','Приходите к собственнику с готовым расчётом, а не с идеей.'],
      ['Рядом собственники бизнеса','Больше половины группы — собственники: видите бизнес их глазами.']
    ]:[
      ['Актуальная программа','Обновляется каждый поток с учётом реалий рынка.'],
      ['Преподают практики','Собственники и руководители действующего бизнеса: разбираете то, что работает сейчас.'],
      ['Работаете над задачей своей компании','Решения проверяете на своём бизнесе, а не на учебных кейсах.'],
      ['Рядом такие же собственники','Больше половины группы — собственники, остальные — топ-менеджеры. Решения обсуждаете с равными.']
    ];
  S('obj-slide',`<div class="kick">Почему сейчас</div><h2>${TOP?'Как MBA помогает расти в карьере в 2027 году':'Как MBA помогает расти бизнесу в 2027 году'}</h2>
    <div class="obj-rows">${OBJ.map((r,i)=>`<div class="orow"><span class="or-n">0${i+1}</span><b>${r[0]}</b><p>${r[1]}</p></div>`).join('')}</div>`);

  // 13а · календарь модулей: расписание 1 семестра (группа MBA-1026, набор октябрь 2026)
  // [месяц, год, номер месяца от старта, платёж, выезд, [[даты, модуль, преподаватель, коротко для карточки]]]; 2 семестр школа пока не прислала
  const CAL=[
    ['Октябрь',2026,1,1,0,[['29 окт','Командообразование','Антон Емельянов'],['30 окт – 1 ноя','Лидерство и организационное поведение','Владислава Друтько']]],
    ['Ноябрь',2026,2,0,0,[['19–20 ноя','Управление финансами компании','Зоя Стрелкова'],['21–22 ноя','Инвестиционные стратегии','Демид Голиков']]],
    ['Декабрь',2026,3,0,0,[['17–18 дек','Стратегия: рыночный анализ. Создание информационной основы деятельности','Роман Копосов','Стратегия: рыночный анализ'],['19–20 дек','Операционная стратегия и оптимизация бизнес-процессов. Часть 1','Андрей Коптелов','Операционная стратегия, ч. 1']]],
    ['Январь',2027,4,2,0,[['21–22 янв','Цифровая стратегия и трансформация бизнеса','Олег Сковородников'],['23–24 янв','Операционная стратегия и оптимизация бизнес-процессов. Часть 2','Андрей Коптелов','Операционная стратегия, ч. 2']]],
    ['Февраль',2027,5,0,1,[['даты уточняются','Международный бизнес (Дубай, ОАЭ)','по отдельной программе','Международный бизнес']]],
    ['Март',2027,6,0,0,[['25–27 мар','Стратегическое управление в условиях изменений','Сергей Макшанов'],['28 мар','Интернет-стратегия (Бизнес и Digital)','Григорий Карлышев']]]
  ];
  const calEv=(r,tag='')=>`<div class="ag-ev"><b${r[0][0]==='д'?' class="tbc"':''}>${r[0]}</b><span>${r[3]||r[1]}${tag}</span></div>`;
  const calRow=g=>`<div class="ag-r${g[4]?' dxb':''}"><div class="ag-m"><span class="ag-n">${String(g[2]).padStart(2,'0')}</span><span class="ag-mm">${g[0]}<small>${g[1]}</small></span></div>${g[5].map(r=>calEv(r,g[4]?'<span class="ag-tag">Выезд в Дубай, ОАЭ</span>':'')).join('')}</div>`;
  S('cal-slide ag-slide',`<div class="kick">Календарь</div><h2>Календарь модулей</h2>
    <div class="ag">${CAL.map(calRow).join('')}<div class="ag-r s2"><div class="ag-m"><span class="ag-mm">2 семестр</span></div><div class="ag-ev"><span>Даты и модули уточняются</span></div></div></div>`);

  // 13 · форматы участия
  const fmIco=k=>FM_ICON[k]?`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${FM_ICON[k]}</svg>`:ico(k);
  const fmc=FORMATS.map((x,i)=>`<div class="fmx-card${i?'':' fmx-main'}"><h3>${x[0]}</h3><div class="fmx-price">${rub(x[1])}</div>${i?'':`<p class="fmx-pn">${x[3]}</p>`}
    <ul class="fmx-list">${FM_ITEMS[i].map(y=>`<li>${fmIco(y[0])}<span>${y[1]}${y[2]?`<small>${y[2]}</small>`:''}</span></li>`).join('')}</ul>${i?'':'<p class="fmx-note">* перелёт и проживание оплачиваются дополнительно</p>'}</div>`);
  S('fm-slide',`<div class="kick">Стоимость</div><h2>Форматы участия</h2><div class="fmx">${fmc[0]}<div class="fmx-side">${fmc[1]}${fmc[2]}</div></div>`);

  // 14а · график платежей: 4 платежа каждые три месяца с начала обучения
  const PAY_MONTHS=[['Октябрь',2026],['Ноябрь',2026],['Декабрь',2026],['Январь',2027],['Февраль',2027],['Март',2027],['Апрель',2027],['Май',2027],['Июнь',2027],['Июль',2027],['Август',2027],['Сентябрь',2027]];
  const CAL_PAY=[1,4,7,10];
  S('pay-slide',`<h2>График платежей</h2><p class="p2-lead">${CAL_PAY.length} платежа, каждые 3 месяца</p>
    <div class="p2-tl"><span class="p2-cap">Календарь платежей</span><span class="p2-y" style="grid-column:1 / span 3">2026 год</span><span class="p2-y" style="grid-column:4 / span 9">2027 год</span>${PAY_MONTHS.map((x,i)=>`<span class="p2-m${CAL_PAY.includes(i+1)?' on':''}">${x[0]}</span>`).join('')}
      ${CAL_PAY.map((m,i)=>`<div class="p2-c" style="grid-column:${m} / span 3"><b>${i+1} платёж</b><span>${PAY_MONTHS[m-1][0]} ${PAY_MONTHS[m-1][1]}</span></div>`).join('')}</div>`);

  // 16 · вдвоём с коллегой
  S('duo-slide',`${pic('design-img/photos/duo-graduates.jpg',36,'duo-photo')}<div class="body"><div class="kick">Стоимость</div><h2>Вдвоём с коллегой — скидка ${pct}%</h2>
    <div class="duo-wrap"><div class="duo-old">${rub(PRICE)}</div><div class="duo-lab">без скидки</div><div class="duo-disc">Скидка ${rub(PRICE-one)}</div><div class="duo-new">${rub(one)}</div><div class="duo-cap">стоимость на одного участника</div></div>
    <p class="duo-tax">Налоговый вычет за обучение можно вернуть</p></div>`);

  // 17 · что получит компания: у топ-менеджеров — бизнес и карьера (топ перешлёт собственнику и совету),
  // у собственников — если отправляете сотрудника, про деньги. Только факты программы: результаты модулей (BLOCKS),
  // слайд 4 (задача компании, план внедрения), слайд 5 (12 модулей, 4 дня в месяц); кейсы выпускников здесь не повторяем
  // [группа, что получает компания, [результаты]]
  const GAIN=TOP?[
      ['Бизнес','Разбор задачи вашей компании',['решение с преподавателями-практиками','план внедрения: ответственные и контрольные точки']],
      ['Бизнес','Деньги под контролем',['видно, где компания теряет маржу','вкладываете только в то, что окупится']],
      ['Бизнес','Без отрыва от работы',['12 модулей за год, 4 дня в месяц','руководитель не выпадает из рабочих процессов']],
      ['Карьера','Управленец следующего уровня',['задачи уходят вниз и возвращаются сделанными','решения утверждают с первого раза']]
    ]:[
      ['','Затраты под контролем',['видно, где компания теряет маржу','фонд оплаты не растёт быстрее выработки']],
      ['','Вложения только по расчёту',['вкладываете только в то, что окупится','новый рынок оценён до вложений']],
      ['','Продажи как система',['стоимость привлечения клиента падает','продажи не держатся на двух сильных людях']],
      ['','Разбор задачи вашей компании',['план внедрения: ответственные и контрольные точки','4 дня в месяц, без отрыва от работы']]
    ];
  const gainGrp=[...new Set(GAIN.map(r=>r[0]))];
  // у собственников: «Направляя сотрудника на MBA, вы получаете» — 4 работы собственника (как слайды задач 7–13) + внедрение;
  // номера модулей под пунктом открывают карточку модуля (MODINFO), как на слайдах задач
  const SEND=[[[5,9],'Финансовые решения приходят к вам с расчётом окупаемости'],[[1,4,10,12],'Операционное управление переходит к команде'],
    [[3,11,6],'Продажи работают как система'],[[2,7,8],'Сотрудник становится вашим советником по стратегии'],
    [[],'Первые результаты — уже во время обучения, направление работы согласуется с вами']];
  // у топ-менеджеров вместо «Что получит компания»: что вы получите в конце программы — по работам топа (карьера), модули по клику
  const FIN=[[[2,7,8],'Видите компанию целиком и готовы к общему управлению'],[[5,9],'Говорите с собственником на языке денег'],
    [[1,4,10,12],'Команда работает без вашего ручного контроля'],[[],'Выпускной проект, который можно показать собственнику и будущему работодателю'],
    [[],'Диплом MBA и круг собственников и топ-менеджеров']];
  if(TOP)S('why2 blk-slide send-slide fin-slide',`${pic('design-img/photos/group-mic.jpg',46)}<div class="body"><h2>Что вы получите в конце программы</h2><p class="fin-lead">Вы выходите управленцем, которого ищет рынок</p>
    <div class="why-rows">${FIN.map(([ms,t],j)=>`<div class="why-row"><span class="why-num">0${j+1}</span><div><b>${t}</b>${ms.length?`<div class="mod-chips">${ms.map(n=>`<button type="button" data-m="${n}" title="Открыть программу модуля">${MODCHIP[n]}</button>`).join('')}</div>`:''}</div></div>`).join('')}</div></div><div class="mod-pop"></div>`);
  else S('why2 blk-slide send-slide',`${pic('design-img/photos/blk-team.jpg',46)}<div class="body"><h2>Направляя сотрудника на MBA, вы получаете</h2>
    <div class="why-rows">${SEND.map(([ms,t],j)=>`<div class="why-row"><span class="why-num">0${j+1}</span><div><b>${t}</b>${ms.length?`<div class="mod-chips">${ms.map(n=>`<button type="button" data-m="${n}" title="Открыть программу модуля">${MODCHIP[n]}</button>`).join('')}</div>`:''}</div></div>`).join('')}</div></div><div class="mod-pop"></div>`);

  // закрывающий слайд: призыв и контакты менеджера, редактируются на слайде (код и данные — перед render())
  out+=closingSlide();
  d.innerHTML=out;
  updateCount();
}

const qs=new URLSearchParams(location.search);
if(qs.get('p'))qs.get('p').split(',').filter(Boolean).forEach(k=>sel.add(k));
else JOBS.slice(0,2).forEach(j=>sel.add(j.k));
picks();render();

// слайд рисуется в фиксированном размере 1280×720 и масштабируется под ширину окна
function setZoom(){
  const d=document.getElementById('deck');
  const z=Math.max(.3,(d.clientWidth-40)/1280);
  d.style.setProperty('--z',z);
}
window.addEventListener('resize',setZoom);setZoom();
// автоподбор: если содержимое слайда не помещается, уменьшаем шрифты только на нём
function fitSlides(){
  document.querySelectorAll('#deck .slide:not(.source-slide):not(.cover)').forEach(sl=>{
    sl.style.removeProperty('--k');
    let k=1;
    const over=()=>sl.scrollHeight>sl.clientHeight+2||
      [...sl.querySelectorAll('.box,.cols,.stack,.st,.jobrows,.cs,.ovg,.ovc,.tk,.tsteps,.tc')].some(e=>e.scrollHeight>e.clientHeight+2);
    while(k>.85&&over()){k=Math.round((k-.04)*100)/100;sl.style.setProperty('--k',k)}
    if(k===1&&!over()&&sl.querySelector('.ovg')){let g=1;while(g<1.3){g=Math.round((g+.05)*100)/100;sl.style.setProperty('--k',g);if(over()){g=Math.round((g-.05)*100)/100;sl.style.setProperty('--k',g);break}}}
  });
}
let fitT;
new ResizeObserver(()=>{clearTimeout(fitT);fitT=setTimeout(fitSlides,60)}).observe(document.getElementById('deck'));
new MutationObserver(()=>{clearTimeout(fitT);fitT=setTimeout(fitSlides,60)}).observe(document.getElementById('deck'),{childList:true});
window.addEventListener('beforeprint',fitSlides);
if(document.fonts)document.fonts.ready.then(fitSlides);
</script>
