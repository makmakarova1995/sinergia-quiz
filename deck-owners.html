<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBA Foundation для собственника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#FF003D;--tx:#f2f2f2;--tx2:#b9b9b9;--tx3:#7a7a7a;--card:#1C1C1C;--line:#2c2c2c;
  --serif:'Playfair Display','Times New Roman',Georgia,serif;
  --sans:'Manrope','Inter',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#111;color:var(--tx);font-weight:300;line-height:1.5}

/* ── панель сборки (не печатается) ── */
.layout{display:grid;grid-template-columns:380px minmax(0,1fr);align-items:start}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:#161616;border-right:1px solid var(--line);z-index:99}
.panel{position:sticky;top:0;background:#161616;border-bottom:1px solid var(--line);z-index:2}
.panel-in{padding:14px 16px;display:flex;flex-direction:column;align-items:stretch;gap:9px}
.panel .ttl{font-family:var(--serif);font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tx2);white-space:nowrap}
.who{display:flex;gap:7px}
.who input{background:#0d0d0d;border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  color:#fff;font-family:var(--sans);font-size:13px;width:100%;min-width:0;outline:none}
.who input:focus{border-color:var(--red)}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.acts .pri{flex:1}
.btn{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:999px;
  padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--red);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.cnt{color:var(--tx3);font-size:12.5px;white-space:nowrap}
.cnt b{color:#fff}
.drawer{padding:0 16px 20px}
.picks{padding-top:2px}
.pick-group{margin-top:11px}
.pick-group h4{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:0 0 5px}
.pick-grid{display:grid;grid-template-columns:1fr;gap:6px}
.pick{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13px;color:var(--tx2);transition:.14s}
.pick:hover{border-color:#444}
.pick.on{border-color:var(--red);color:#fff;background:#1f1517}
.pick input{accent-color:var(--red);margin-top:2px;flex:none}
.pick small{display:block;color:#ffb020;font-size:10.5px;margin-top:2px;line-height:1.25}
.pick-task{display:block;font-size:13.5px;line-height:1.38;color:inherit;text-wrap:pretty}
.audience-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-top:2px}
.audience{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.audience .aud{min-height:40px;border:0;border-radius:6px;background:#0d0d0d;color:var(--tx2);font:500 12px var(--sans);cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.1);transition:background-color .15s,box-shadow .15s,color .15s,transform .15s}
.audience .aud:hover{box-shadow:0 0 0 1px rgba(255,255,255,.25);color:#fff}
.audience .aud:active{transform:scale(.97)}
.audience .aud.on{background:var(--red);box-shadow:none;color:#fff}

/* ── слайды ── */
.deck{margin:0 auto;padding:16px 20px 50px;min-width:0;width:100%}
.slide{container-type:inline-size;position:relative;width:1280px;height:720px;flex:none;zoom:var(--z,1);background:linear-gradient(135deg,#353535 0%,#0a0a0a 55%,#000 100%);
  border:1px solid #242424;border-radius:10px;padding:5.2% 6%;margin-bottom:18px;overflow:hidden;
  display:flex;flex-direction:column}
.slide.source-slide{padding:0;background:#000}
.source-slide img{display:block;width:100%;height:100%;object-fit:cover}
.slide .mark{position:absolute;top:4.4%;right:5%;width:30px;height:30px;border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center}
.slide .mark::before{content:'❮';color:#fff;font-size:12px}
.slide .ft{position:absolute;bottom:4%;left:6%;right:6%;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a4a4a}
.kick{color:var(--red);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
.slide h1{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.04;
  font-size:calc(4.867cqw*var(--k,1))}
.slide h2{font-family:var(--serif);font-weight:500;text-transform:uppercase;line-height:1.08;
  font-size:calc(3.38cqw*var(--k,1));margin-bottom:18px}
.slide h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);
  font-weight:600;margin-bottom:9px}
.quote{font-family:var(--serif);font-size:calc(2.704cqw*var(--k,1));line-height:1.34;color:#fff;font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3.4%;flex:1;min-height:0}
.tcols{grid-template-columns:.82fr 1.18fr;gap:2.6%}
.tcols .box{padding:1.7% 2.4%}
.tcols .box.stack .st{padding:1.4% 0}
.tcols li{margin-bottom:4px}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:0 4%}
.tcols h3{margin-bottom:6px}
.box{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3.4% 3.8%}
.box.dim{border-left-color:#4a4a4a}
.box p,.box li{font-size:calc(1.447cqw*var(--k,1));color:var(--tx2);line-height:1.5}
.box b{color:#fff;font-weight:600}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:7px}
li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.box.dim li::before{background:#555}
.fig{font-family:var(--serif);color:var(--red);font-size:1.22em}
.who-t{color:#fff;font-weight:600}
.reg{display:block;color:var(--tx3);font-size:.86em}
.modn{display:inline-block;font-family:var(--serif);font-size:.82em;letter-spacing:.06em;color:#fff;
  background:var(--red);border-radius:3px;padding:1px 7px;margin-right:7px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:1.6% 3.4%;flex:1;align-content:space-between;padding-bottom:2%}
.mods div{font-size:calc(1.45cqw*var(--k,1));color:var(--tx2);padding:1.5% 0;border-bottom:1px solid #1e1e1e}
.mods .no{font-family:var(--serif);color:var(--red);margin-right:9px}
.mods div.hit{color:#fff;background:rgba(255,0,61,.08);border-left:2px solid var(--red);padding-left:8px}
.teach{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4% 3%;flex:1;align-content:start}
.teach div{font-size:calc(1.244cqw*var(--k,1));color:var(--tx3);line-height:1.38}
.teach b{display:block;color:#fff;font-weight:600;font-size:1.1em;margin-bottom:3px;
  font-family:var(--serif);text-transform:uppercase;letter-spacing:.02em}
.empty{color:var(--tx3);text-align:center;padding:70px 20px;font-size:15px}

/* обложка — как первый и последний слайд в презентации школы */
.slide.cover{padding:0;background:#000 url(design-img/fmba-cover.jpg) center/cover no-repeat}
.cover .for{position:absolute;left:4.4%;top:8%;max-width:50%;font-family:var(--serif);
  font-size:calc(2.163cqw*var(--k,1));color:#fff;line-height:1.3}
.cover .for small{display:block;font-family:var(--sans);font-size:.5em;letter-spacing:.2em;
  text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:6px}
/* стоимость и рассрочка */
.price{font-family:var(--sans);font-weight:600;color:#fff;line-height:1;letter-spacing:-.02em;
  font-size:calc(7.301cqw*var(--k,1));margin:auto 0}
.price-note{font-size:calc(1.149cqw*var(--k,1));letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600}
.incl{counter-reset:i}
.incl li{counter-increment:i;padding-left:34px;padding-bottom:2.2%;margin-bottom:2.2%;border-bottom:1px solid #262626}
.incl li::before{content:counter(i);background:none;border:1px solid #444;border-radius:999px;width:22px;height:17px;
  top:1px;font-family:var(--serif);font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center}
.duo{margin-top:3%;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.duo .fig{font-size:calc(2.974cqw*var(--k,1))}
.todo{color:#ffb020;font-style:normal}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:3% 0 2.4%}
.week span{text-align:center;padding:7px 0;border-radius:4px;font-size:calc(1.217cqw*var(--k,1));font-weight:600;letter-spacing:.08em}
.week .w{background:var(--red);color:#fff}
.week .o{background:#2a2a2a;color:var(--tx2)}
.wk-note{font-size:calc(1.284cqw*var(--k,1));color:var(--tx2);line-height:1.45}
.wk-note b{color:#fff;font-weight:600}
.trj{width:100%;border-collapse:collapse;font-size:calc(1.1cqw*var(--k,1))}
.trj td{padding:2.2% 2% 2.2% 0;border-bottom:1px solid #262626;vertical-align:top;color:var(--tx2)}
.trjcols{grid-template-columns:1.9fr .75fr}
.trjcols .stack .st p{font-size:calc(1.1cqw*var(--k,1))}
.trjcols .stack .lbl{font-size:calc(1.3cqw*var(--k,1))}
.trj td:first-child{color:#fff;width:32%}
.trj td:nth-child(2){white-space:nowrap}
.trj.compact{font-size:calc(1.1cqw*var(--k,1))}
.trj.compact td{padding:1.7% 1.5% 1.7% 0}
/* пункты в столбик на всю высоту колонки */
.stack{display:flex;flex-direction:column}
.stack .st{flex:1;display:flex;flex-direction:column;justify-content:center;border-top:1px solid #2a2a2a;padding:3% 0}
.stack h3+.st{border-top:none}
.stack .lbl{font-family:var(--serif);color:var(--red);font-size:calc(1.96cqw*var(--k,1));line-height:1.15;margin-bottom:1.5%}
.stack .st p{font-size:calc(1.622cqw*var(--k,1));color:#e6e6e6;line-height:1.42}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6%;flex:1;min-height:0}
.fmts .box{display:flex;flex-direction:column}
.fmts .price{font-size:calc(4.056cqw*var(--k,1));margin:auto 0 0}
/* преподаватели с фото */
.tph{display:grid;grid-template-columns:repeat(6,1fr);gap:2% 1.6%;flex:1;min-height:0;align-content:start}
.tph div{background:rgba(255,255,255,.03);border:1px solid #262626;border-radius:6px;padding:5%;
  font-size:calc(1.001cqw*var(--k,1));color:var(--tx3);line-height:1.32}
.tph img{width:100%;aspect-ratio:1.7;object-position:50% 20%;object-fit:cover;max-height:none;border-radius:4px;display:block;margin-bottom:6%;background:#5a5a5a}
.tph b{display:block;color:#fff;font-family:var(--serif);font-weight:500;text-transform:uppercase;
  font-size:calc(1.162cqw*var(--k,1));line-height:1.15;margin-bottom:3%}
.tph div span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.also{margin-top:1.6%;margin-bottom:2.4%;font-size:calc(1.109cqw*var(--k,1));color:var(--tx3)}
.also b{color:var(--tx2);font-weight:500}
/* цифры */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3%}
.stat{background:rgba(255,255,255,.035);border-radius:6px;padding:7% 8%}
.stat .num{white-space:nowrap;font-family:var(--serif);font-size:calc(4.867cqw*var(--k,1));line-height:1;color:#fff}
.stat .num.red{color:var(--red)}
.stat p{font-size:calc(1.284cqw*var(--k,1));color:var(--tx2);margin-top:6%;line-height:1.35}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:3.4% 2.6%;flex:1;min-height:0}
.res .stat{border-left:2px solid var(--red);display:flex;flex-direction:column}
.res .stat .num{white-space:normal;overflow-wrap:anywhere;color:var(--red);font-size:calc(3.921cqw*var(--k,1))}
.res .stat small{margin-top:auto;padding-top:4%;font-size:calc(1.082cqw*var(--k,1));color:var(--tx3)}
.res .stat small b{color:#fff;font-weight:600}
/* кейс */
.case{display:grid;grid-template-columns:1.25fr 1fr;gap:3.4%;flex:1;min-height:0}
.case .big{font-family:var(--serif);color:var(--red);font-size:calc(6.49cqw*var(--k,1));line-height:1}
.case .bigt{font-size:calc(1.555cqw*var(--k,1));color:#fff;margin-top:3%;max-width:90%}
.case .ph{width:34%;aspect-ratio:.8;object-fit:cover;border-radius:6px;float:right;margin:0 0 4% 5%}
.case .qt{font-family:var(--serif);font-size:calc(1.758cqw*var(--k,1));color:#fff;line-height:1.35;margin-top:auto}
.case-res{font-family:var(--serif);font-size:calc(2.704cqw*var(--k,1));line-height:1.15;color:var(--red);margin:0 0 3%}
.case-src{display:block;color:var(--tx3);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:2%}

/* минимальные размеры мелкого текста (холст слайда 1280×720) */
.slide .case-src,.slide .also,.slide .res .stat small{font-size:13px}
.slide .tph div{font-size:11.5px}
.slide .tph b{font-size:13px}
.slide .modn{font-size:.9em}
.slide .reg{font-size:.92em}

.fmts .box li,.fmts .box p:not(.price-note){font-size:calc(1.7cqw*var(--k,1));line-height:1.45}
.fmts .box h3{font-size:12.5px}
@media print{
  @page{size:1280px 720px;margin:0}
  body{background:#fff}
  .side,.panel,.noprint{display:none!important}
  .layout{display:block}
  .deck{max-width:none;padding:0;margin:0}
  .slide{border:none;border-radius:0;margin:0;page-break-after:always;break-after:page;
    width:1280px;height:720px;zoom:1;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:900px){.layout{display:block}.side{position:static;height:auto;max-height:50vh}}
/* крупный шрифт: смотрят с ноутбука, часть читателей 50+ */
.layout.nosb{grid-template-columns:1fr}
.layout.nosb .side{display:none}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:0 4%;align-content:stretch}
.ov .st{padding:2% 0}
.slide .kick{font-size:15px;margin-bottom:12px}
.slide h2{font-size:calc(3cqw*var(--k,1));line-height:1.1}
.slide h3{font-size:15px;margin-bottom:12px}
.slide .ft{font-size:13px}
.slide .box p,.slide .box li{font-size:calc(1.72cqw*var(--k,1));line-height:1.4}
.slide .stack .lbl{font-size:calc(2cqw*var(--k,1))}
.slide .stack .st p{font-size:calc(1.72cqw*var(--k,1))}
.slide .stat p{font-size:calc(1.5cqw*var(--k,1))}
.slide .res .stat small{font-size:15px}
.slide .mods div{font-size:calc(1.6cqw*var(--k,1))}
.slide .tph div{font-size:15px;line-height:1.3}
.slide .tph b{font-size:16px}
.slide .tph div span{-webkit-line-clamp:3}
.slide .also{font-size:15px}
.slide .wk-note{font-size:calc(1.55cqw*var(--k,1))}
.slide .price-note{font-size:15px}
.slide .incl li{font-size:calc(1.65cqw*var(--k,1))}
.jobhead{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:.8%}
.jobrows{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.jr{display:grid;grid-template-columns:10% 1fr;align-items:center;flex:1 1 auto;border-top:1px solid #2a2a2a;padding:.9% 0}
.jn{font-family:var(--serif);font-size:calc(4cqw*var(--k,1));color:var(--red);line-height:1}
.jn small{display:block;font-family:var(--sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:3px}
.js{font-size:calc(2.2cqw*var(--k,1));color:#fff;line-height:1.22;margin:0}
.jm{font-size:calc(1.45cqw*var(--k,1));color:var(--tx2);line-height:1.3;margin:.5% 0 0}
.jobout{flex:none;margin-top:1.4%;padding:1.2% 2%;background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;font-size:calc(1.7cqw*var(--k,1));color:#fff;line-height:1.35}
.jobout b{color:var(--red)}
.jobme2{flex:none;margin-top:1.2%;padding:1% 2%;background:rgba(255,255,255,.04);border-left:2px solid #555;border-radius:5px;font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.jobme2 b{color:#fff}
.cs{display:grid;grid-template-columns:.8fr 1.2fr;gap:2.6%;flex:1;min-height:0}
.cs .box{display:flex;flex-direction:column;min-height:0}
.cs .cbig{font-family:var(--serif);color:var(--red);font-size:calc(4.2cqw*var(--k,1));line-height:1.05;margin-bottom:1%}
.cs .cbigt{font-size:calc(1.75cqw*var(--k,1));color:#fff;margin:0 0 4%;line-height:1.35}
.cs ul li{font-size:calc(1.6cqw*var(--k,1));color:var(--tx2);line-height:1.38;margin-bottom:8px}
.cs .jr{grid-template-columns:13% 1fr}
.cs .jn{font-size:calc(3.2cqw*var(--k,1))}
.cs .js{font-size:calc(1.9cqw*var(--k,1))}
.cs .jm{font-size:calc(1.3cqw*var(--k,1))}
.casetodo{flex:none;margin-top:1.4%;font-size:calc(1.4cqw*var(--k,1));color:var(--tx2)}

.jsub{font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);line-height:1.35;margin:0 0 1%}
.jsub b{color:#fff;font-weight:600}

.jsub{font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.35;margin:0 0 1.2%}
.jobout{padding:1% 2%}
.jobout p{margin:0 0 .5%;font-size:calc(1.55cqw*var(--k,1));color:#fff;line-height:1.35}
.jobout p:last-child{margin-bottom:0}
.jobout b{color:var(--red)}

.jobout b{color:#ff8aa3}
.jr{padding:.55% 0}
.jn{font-size:calc(3.6cqw*var(--k,1))}
.js{font-size:calc(2.1cqw*var(--k,1))}
.jm{font-size:calc(1.5cqw*var(--k,1))}
.jobhead{margin-bottom:.4%}

.ovg{display:grid;gap:2.2%;flex:1;min-height:0;grid-auto-rows:1fr}
.ovc{background:rgba(255,255,255,.035);border-left:2px solid var(--red);border-radius:5px;padding:3% 3.2%;display:flex;flex-direction:column;min-height:0}
.ovn{color:#7a7a7a;margin-right:.4em}
.ovt{font-family:var(--serif);color:var(--red);font-size:calc(2.35cqw*var(--k,1));line-height:1.15;margin-bottom:4%}
.ovp{font-size:calc(1.8cqw*var(--k,1));color:#fff;line-height:1.38;margin:0}
.ovm{margin-top:auto;padding-top:4%;font-size:calc(1.5cqw*var(--k,1));color:var(--tx2);margin-bottom:0}
.fmts.big .box p,.fmts.big .box li{font-size:calc(2.1cqw*var(--k,1));line-height:1.4}
.fmts.big .box li{margin-bottom:14px}

.ovg.sm .ovt{font-size:calc(1.9cqw*var(--k,1));margin-bottom:3%}
.ovg.sm .ovp{font-size:calc(1.5cqw*var(--k,1))}
.ovg.sm .ovm{font-size:calc(1.3cqw*var(--k,1));padding-top:2%}
.ovg.sm .ovc{padding:2.4% 2.8%}
.ovs{font-size:calc(1.7cqw*var(--k,1));color:var(--tx2);line-height:1.4;margin:0 0 4%}
.jobout b{color:#fff;font-weight:600}
.fmts.inst{align-items:start;flex:none}

.fmts.inst{margin:auto 0;align-self:stretch}
.fmts.inst .box p{font-size:calc(2.3cqw*var(--k,1))}

.fmts.mid .box p,.fmts.mid .box li{font-size:calc(2.1cqw*var(--k,1))}

/* ── полировка по скиллу 4-make-interfaces-feel-better (чистый CSS, без анимации появления) ── */
/* #10 сглаживание шрифта */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* #11 табличные цифры там, где цены и номера модулей стоят в столбик */
.price,.stat .num,.jn,.ovn,.cnt,.rub,.fmts li,.modn,.who-t{font-variant-numeric:tabular-nums}
/* #12/#13 заголовки ровными строками, текст без «сирот» */
.slide h1,.slide h2,.ovt,.js,.cbig,.stack .lbl,.case-res{text-wrap:balance}
.slide p,.slide li,.jm,.ovp,.ovs,.jsub{text-wrap:pretty}
/* #16 вместо transition:all — только дешёвые свойства */
.btn{transition:background-color .15s,border-color .15s,color .15s,transform .15s cubic-bezier(.2,0,0,1)}
.pick{transition:background-color .15s,box-shadow .15s,color .15s,transform .15s cubic-bezier(.2,0,0,1)}
/* #14 сжатие при нажатии: 0.96, у широкой кнопки 0.98 */
.btn:active{transform:scale(.96)}
.btn.pri:active,.pick:active{transform:scale(.98)}
/* hit area ≥ 40px */
.btn{min-height:40px;display:inline-flex;align-items:center}
.who input{min-height:40px}
.pick{min-height:48px}
.pick input{width:20px;height:20px;margin-top:0}
/* #3/#4 граница тенью вместо border на тёмном фоне */
.who input,.btn:not(.pri),.pick{border:0;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.who input:focus{box-shadow:0 0 0 1px var(--red),0 0 0 4px rgba(255,0,61,.18)}
.btn:not(.pri):hover{box-shadow:0 0 0 1px var(--red)}
.btn.pri{border:0}
.pick:hover{box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.pick.on{box-shadow:0 0 0 1px var(--red)}
.slide{border:0;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tph div{border:0;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
/* #5 тонкий контур поверх фото и картинок школы */
.tph img,.case .ph,.source-slide img{outline:1px solid rgba(255,255,255,.1);outline-offset:-1px}
/* #1 концентрические радиусы: внешний = внутренний + отступ */
.tph div{border-radius:12px}
.tph img{border-radius:6px}
@media print{.slide{box-shadow:none}.tph div{box-shadow:none;border:1px solid #262626}}

/* одна задача — один слайд: воздух, крупно, мало слов */
.slide#job-o1 h2,.slide[id^=job-] h2{margin:0 0 1.4%;font-size:calc(3.1cqw*var(--k,1))}
.tl{font-size:calc(1.9cqw*var(--k,1));color:var(--tx2);margin:0 0 2.6%;line-height:1.35;max-width:88%}
.tk{display:grid;grid-template-columns:1.5fr 1fr;gap:4.5%;flex:1;min-height:0}
.tsteps{display:flex;flex-direction:column;min-height:0}

.tr{display:grid;grid-template-columns:11% 1fr;align-items:center;flex:1;border-top:1px solid #2a2a2a}
.tn{font-family:var(--serif);font-size:calc(4.2cqw*var(--k,1));color:var(--red);line-height:1}
.tp{font-size:calc(2.15cqw*var(--k,1));color:#fff;line-height:1.25;margin:0}
.tm{font-size:calc(1.35cqw*var(--k,1));color:var(--tx3);margin:.6% 0 0;line-height:1.3}
.tc{background:rgba(255,255,255,.04);border-left:2px solid var(--red);border-radius:5px;padding:5% 5.5%;display:flex;flex-direction:column;min-height:0}
.tcl{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:8%}
.tcf{font-family:var(--serif);color:var(--red);font-size:calc(4.4cqw*var(--k,1));line-height:1.05;margin-bottom:4%;text-wrap:balance}
.tcp{font-size:calc(1.9cqw*var(--k,1));color:#fff;line-height:1.35;margin:0}
.tcn{margin-top:auto;padding-top:6%;font-size:calc(1.35cqw*var(--k,1));color:var(--tx2);line-height:1.35}
.tcn b{display:block;color:#fff;font-family:var(--serif);font-weight:500;font-size:calc(1.9cqw*var(--k,1));margin-bottom:2%;text-transform:uppercase}

.tk{grid-template-columns:1.7fr 1fr;gap:5%}
.tr{padding:.5% 0}
.tp{font-size:calc(2.05cqw*var(--k,1))}
.tc{padding:6% 6%}
.tl{margin-bottom:3%}

/* продающий сценарий: сначала задача клиента, затем способ и результат */
.why-slide h2{max-width:88%;margin-bottom:2.6%}

.learn-slide h2{max-width:82%;margin-bottom:1.2%}
.learn-sub{font-size:calc(1.6cqw*var(--k,1));color:var(--tx2);line-height:1.4;margin:0 0 3%;max-width:84%}
.learn-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 5%;flex:1;align-content:start}

.learn-item h3{font-family:var(--serif);font-size:calc(1.65cqw*var(--k,1));line-height:1.2;color:#fff;letter-spacing:0;text-transform:none;font-weight:500;margin:0 0 5%}
.learn-item p{font-size:calc(1.45cqw*var(--k,1));line-height:1.35;color:var(--tx2)}
.story-case h2{margin-bottom:.8%}
.case-role{font-size:calc(1.55cqw*var(--k,1));color:var(--tx2);margin-bottom:3%}
.story-case-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:7%;flex:1;align-items:stretch}
.case-result{border-top:2px solid var(--red);padding-top:8%;display:flex;flex-direction:column}

/* ═══ правки по итогам встречи: картинки, новая структура слайдов ═══ */
.slide .ft,.slide .mark{z-index:3}
.slide .body{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0}
.ico{width:1em;height:1em;display:block;flex:none}
/* фото: чёрно-белые, под цвет обложки */
.pic{position:absolute;overflow:hidden;background:#1a1a1a;z-index:0}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05) brightness(.92)}
.pic.r{right:0;top:0;bottom:0;width:var(--w,40%)}
.pic.r::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#060606 0%,rgba(6,6,6,.62) 24%,rgba(6,6,6,0) 62%)}
.pic.r.flat::after{display:none}
.pic.in{position:relative;border-radius:8px;min-height:0}
.pic.in::after{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}

const DEF_CASES=['nishchev','kuzyakov','kapyev'];
function pickCases(list){
  const ks=new Set(list.map(i=>i.k));
  const out=CASES.filter(c=>c.for.some(k=>ks.has(k)));
  for(const k of DEF_CASES){if(out.length>=3)break;if(!out.find(c=>c.k===k))out.push(CASES.find(c=>c.k===k))}
  return out;
}

      ['Сначала увидеть, чего вы не знаете','Кажется, что не хватает финансов. Но в стратегии и планировании опыт последних 10 лет сейчас не работает.'],
      ['Программа продаётся целиком','Это комплексная отстройка системы. По кусочкам она не работает.'],
      ['Готовые решения перестали работать','Прежние инструменты больше не работают: нужны новые шаги и выход из привычных практик.']
    ].map((r,i)=>`<div class="orow"><span class="or-n">0${i+1}</span><b>${r[0]}</b><p>${r[1]}</p></div>`).join('')}</div>`);

  // 13 · календарь модулей и платежи
  S('cal-slide',`<div class="kick">Календарь</div><h2>12 модулей за год и график платежей</h2>
    <div class="cal">${MODSHORT.map((nm,i)=>{const m=i+1;const pn={1:1,3:2,6:3}[m];const p=pn?`<span class="pay">${pn} платёж</span>`:'';
      return `<div class="mc${m===6?' dxb':''}"><span class="mm">Месяц ${m}${DATES[i]?` · ${DATES[i]}`:''}</span><span class="mn">${String(m).padStart(2,'0')}</span><span class="mt">${nm}</span>${m===6?'<span class="tag">выезд в Дубай</span>':''}${p}</div>`}).join('')}</div>
    <div class="cal-leg"><span><b>Каждый модуль:</b> четверг — воскресенье, из рабочего графика выпадают чт и пт</span><span><b>Платежи:</b> 1-й — месяц 1, 2-й — месяц 3, 3-й — месяц 6. ${todo('[суммы траншей — уточнить]')}</span></div>`);

  // 14 · форматы участия и что включено
  S('fm-slide',`<div class="kick">Стоимость</div><h2>Форматы участия</h2><div class="fmts">${FORMATS.map((x,i)=>`<div class="box${i?' dim':''}"><h3>${x[0]}</h3><ul>${x[2].map(y=>`<li>${y}</li>`).join('')}</ul><div class="price">${rub(x[1])}</div><p class="price-note${i?' hy':''}">${x[3]}</p></div>`).join('')}</div>
    <div class="fm-incl"><h3>Что включено в «Очно»</h3><ul>${INCLUDED.map(x=>`<li>${x}</li>`).join('')}</ul><p class="fm-note">* перелёт и проживание оплачиваются дополнительно</p></div>`);

  // 15 · рассрочка
  const tmln=(label,months)=>`<div class="tr2"><div class="tr2-l">${label}</div><div class="tmln">${Array.from({length:12},(_,i)=>{const m=i+1,k=months.indexOf(m);return `<div class="tmc${k>=0?' on':''}">${k>=0?`<span class="tmd">${k+1}</span>`:''}${m}${k>=0?`<small>${k+1} платёж</small>`:''}</div>`}).join('')}</div></div>`;
  S('',`<div class="kick">Оплата</div><h2>Можно платить частями</h2><div class="inst-grid">
    <div class="box tl-card"><h3>Платите частями</h3><p class="tl-sub">Платёж — в 1, 3 и 6 месяц обучения</p>${PAY_SCHEMES.map(s=>tmln(s[0],s[1])).join('')}<p class="tl-note">${todo('[суммы траншей — уточнить]')}</p></div>
    <div class="inst-side">${INSTALL.map(x=>`<div class="box dim"><h3>${x[0]}</h3><p>${todo(x[1])}</p></div>`).join('')}</div></div>`);

  // 16 · вдвоём с коллегой
  S('duo-slide',`<div class="kick">Стоимость</div><h2>Вдвоём с коллегой — скидка ${pct}%</h2>
    <div class="duo-wrap"><div><div class="duo-old">${rub(PRICE)}</div><div class="duo-lab">без скидки</div><div class="duo-disc">Скидка ${rub(PRICE-one)}</div><div class="duo-new">${rub(one)}</div><div class="duo-cap">стоимость на одного участника</div></div><div class="duo-ico">${ico('rings')}</div></div>
    <p class="duo-tax">Налоговый вычет за обучение можно вернуть</p>`);

  // 17 · для учредителя (только версия для топ-менеджера)
  if(TOP){
    S('',`<div class="kick">Для учредителя и совета</div><h2>Что получит компания</h2>
      <div class="fcards"><div class="fc">${ico('file')}<b>Выпускной проект</b><p>по выбранной задаче компании</p></div><div class="fc">${ico('calc')}<b>Расчёт</b><p>и план внедрения</p></div><div class="fc">${ico('award')}<b>Эксперт</b><p>выпускного проекта</p></div></div>`);
  }

  // 18 · закрывающий слайд — как обложка
  out+='<section class="slide cover"></section>';
  d.innerHTML=out;
  updateCount();
}

const qs=new URLSearchParams(location.search);
if(qs.get('p'))qs.get('p').split(',').filter(Boolean).forEach(k=>sel.add(k));
else JOBS.slice(0,2).forEach(j=>sel.add(j.k));
picks();render();

// слайд рисуется в фиксированном размере 1280×720 и масштабируется под ширину окна
function setZoom(){
  const d=document.getElementById('deck');
  const z=Math.max(.3,(d.clientWidth-40)/1280);
  d.style.setProperty('--z',z);
}
window.addEventListener('resize',setZoom);setZoom();
// автоподбор: если содержимое слайда не помещается, уменьшаем шрифты только на нём
function fitSlides(){
  document.querySelectorAll('#deck .slide:not(.source-slide):not(.cover)').forEach(sl=>{
    sl.style.removeProperty('--k');
    let k=1;
    const over=()=>sl.scrollHeight>sl.clientHeight+2||
      [...sl.querySelectorAll('.box,.cols,.stack,.st,.jobrows,.cs,.ovg,.ovc,.tk,.tsteps,.tc')].some(e=>e.scrollHeight>e.clientHeight+2);
    while(k>.85&&over()){k=Math.round((k-.04)*100)/100;sl.style.setProperty('--k',k)}
    if(k===1&&!over()&&sl.querySelector('.ovg')){let g=1;while(g<1.3){g=Math.round((g+.05)*100)/100;sl.style.setProperty('--k',g);if(over()){g=Math.round((g-.05)*100)/100;sl.style.setProperty('--k',g);break}}}
  });
}
let fitT;
new ResizeObserver(()=>{clearTimeout(fitT);fitT=setTimeout(fitSlides,60)}).observe(document.getElementById('deck'));
new MutationObserver(()=>{clearTimeout(fitT);fitT=setTimeout(fitSlides,60)}).observe(document.getElementById('deck'),{childList:true});
window.addEventListener('beforeprint',fitSlides);
if(document.fonts)document.fonts.ready.then(fitSlides);
</script>
